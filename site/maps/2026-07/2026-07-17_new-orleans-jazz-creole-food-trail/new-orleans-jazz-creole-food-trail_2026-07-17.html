<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Orleans Jazz & Creole Food Trail</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23060606'/%3E%3Cpath d='M50 16c-13.8 0-25 11-25 24.6C25 59 50 84 50 84s25-25 25-43.4C75 27 63.8 16 50 16z' fill='none' stroke='%2338bdf8' stroke-width='7' stroke-linejoin='round'/%3E%3Ccircle cx='50' cy='41' r='9' fill='%2338bdf8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0f0f14; color: #e8e8f0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Header ── */
  .app-header { background: #14141c; border-bottom: 1px solid #2a2a3a; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; z-index: 1000; }
  .header-icon { font-size: 22px; }
  .header-text h1 { font-size: 16px; font-weight: 700; color: #f5d97a; letter-spacing: 0.01em; line-height: 1.2; }
  .header-text p { font-size: 11px; color: #8888aa; margin-top: 1px; }
  .legend { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #aaa; white-space: nowrap; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* ── Main layout ── */
  .app-body { display: flex; flex: 1; overflow: hidden; }
  #map { flex: 1; }

  /* ── Sidebar ── */
  .sidebar { width: 300px; background: #14141c; border-left: 1px solid #2a2a3a; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
  .sidebar-header { padding: 12px 14px; border-bottom: 1px solid #2a2a3a; }
  .sidebar-header h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: #8888aa; font-weight: 600; }
  .sidebar-filter { padding: 10px 14px; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid #2a2a3a; }
  .filter-btn { font-size: 10px; padding: 4px 9px; border-radius: 20px; border: 1px solid #333; background: #1e1e2a; color: #aaa; cursor: pointer; transition: all .15s; }
  .filter-btn:hover, .filter-btn.active { border-color: currentColor; background: transparent; }
  .filter-btn[data-cat="all"].active { color: #f5d97a; border-color: #f5d97a; }
  .filter-btn[data-cat="Jazz Venue"].active { color: #9b7fe8; border-color: #9b7fe8; }
  .filter-btn[data-cat="Creole & Cajun"].active { color: #f07a4a; border-color: #f07a4a; }
  .filter-btn[data-cat="Historic Landmark"].active { color: #4ab8c8; border-color: #4ab8c8; }
  .stop-list { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #333 transparent; }
  .stop-row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; border-bottom: 1px solid #1e1e2a; transition: background .12s; }
  .stop-row:hover { background: #1e1e2a; }
  .stop-row.hidden { display: none; }
  .stop-thumb-wrap { position: relative; flex-shrink: 0; width: 46px; height: 46px; }
  .stop-thumb { width: 46px; height: 46px; object-fit: cover; border-radius: 6px; cursor: pointer; }
  .thumb-count { position: absolute; bottom: 2px; right: 2px; background: rgba(0,0,0,.7); color: #fff; font-size: 9px; border-radius: 3px; padding: 1px 3px; pointer-events: none; }
  .stop-info { flex: 1; min-width: 0; }
  .stop-num { font-size: 10px; color: #666; }
  .stop-name { font-size: 13px; font-weight: 600; color: #e8e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stop-cat { font-size: 10px; margin-top: 2px; }

  /* ── Popup reset ── */
  .leaflet-popup-content-wrapper { background: #16161e; border: 1px solid #2a2a3a; border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.6); padding: 0; overflow: hidden; }
  .leaflet-popup-tip { background: #16161e; }
  .leaflet-popup-content { margin: 0; width: min(300px, 88vw) !important; }

  /* ── Popup card ── */
  .popup-card { overflow: hidden; border-radius: 10px; }
  .popup-media { position: relative; overflow: hidden; }
  .popup-media img { width: 100%; height: 150px; object-fit: cover; display: block; cursor: pointer; }
  .popup-expand { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 2px 5px; border-radius: 4px; pointer-events: none; }
  .popup-photo-count { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; pointer-events: none; }
  .popup-thumbs { display: flex; gap: 4px; padding: 5px 5px 3px; overflow-x: auto; scrollbar-width: thin; scrollbar-color: #333 transparent; }
  .popup-thumbs img { width: 46px; height: 34px; object-fit: cover; border-radius: 4px; cursor: pointer; flex-shrink: 0; border: 1.5px solid transparent; transition: border-color .12s; }
  .popup-thumbs img:hover { border-color: #f5d97a; }
  .popup-body { padding: 10px 12px 10px; }
  .popup-badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 600; margin-bottom: 6px; }
  .popup-title { font-size: 15px; font-weight: 700; color: #f0f0f8; line-height: 1.3; margin-bottom: 5px; }
  .popup-desc { font-size: 12px; color: #aaa; line-height: 1.5; margin-bottom: 6px; }
  .popup-tip { font-size: 11px; color: #c8b870; background: rgba(245,217,122,.08); border-left: 2px solid #f5d97a; padding: 4px 8px; border-radius: 0 4px 4px 0; margin-bottom: 8px; line-height: 1.4; }
  .popup-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .popup-link { font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 1px solid #333; color: #aaa; text-decoration: none; white-space: nowrap; transition: all .12s; }
  .popup-link:hover { border-color: #f5d97a; color: #f5d97a; }
  .popup-link.directions { border-color: #4ab8c8; color: #4ab8c8; }
  .popup-link.directions:hover { background: rgba(74,184,200,.1); }

  /* ── Lightbox ── */
  .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 9999; justify-content: center; align-items: center; }
  .lightbox.open { display: flex; }
  .lightbox-inner { position: relative; max-width: min(90vw, 900px); max-height: 90vh; }
  .lightbox-inner img { max-width: 100%; max-height: 80vh; object-fit: contain; border-radius: 6px; display: block; }
  .lightbox-caption { text-align: center; color: #ccc; font-size: 13px; margin-top: 10px; }
  .lightbox-close { position: absolute; top: -36px; right: 0; color: #fff; font-size: 26px; cursor: pointer; line-height: 1; background: none; border: none; }
  .lightbox-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.55); color: #fff; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .lightbox-arrow.prev { left: -48px; }
  .lightbox-arrow.next { right: -48px; }
  .lightbox-arrow.hidden { display: none; }

  /* ── Category colours ── */
  .cat-jazz { color: #9b7fe8; }
  .cat-creole { color: #f07a4a; }
  .cat-landmark { color: #4ab8c8; }
  .badge-jazz { background: rgba(155,127,232,.15); color: #9b7fe8; }
  .badge-creole { background: rgba(240,122,74,.15); color: #f07a4a; }
  .badge-landmark { background: rgba(74,184,200,.15); color: #4ab8c8; }

  /* ── Mobile ── */
  @media (max-width: 700px) {
    .sidebar { display: none; }
    .leaflet-popup { max-width: 92vw !important; }
    .leaflet-popup-content-wrapper { max-width: 92vw; }
    .leaflet-popup-content { width: min(88vw, 320px) !important; max-height: min(46vh, 320px) !important; overflow-y: auto; }
    .popup-media img { height: 116px !important; }
    .lightbox-arrow.prev { left: -30px; }
    .lightbox-arrow.next { right: -30px; }
  }
  @media (max-width: 400px) {
    .legend { display: none; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-icon">🎷</div>
  <div class="header-text">
    <h1>New Orleans Jazz &amp; Creole Food Trail</h1>
    <p>15 stops · French Quarter, Marigny &amp; Beyond</p>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#9b7fe8"></div>Jazz Venue</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f07a4a"></div>Creole &amp; Cajun</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4ab8c8"></div>Historic Landmark</div>
  </div>
</header>

<div class="app-body">
  <div id="map"></div>
  <aside class="sidebar">
    <div class="sidebar-header"><h2>15 Stops</h2></div>
    <div class="sidebar-filter">
      <button class="filter-btn active" data-cat="all">All</button>
      <button class="filter-btn" data-cat="Jazz Venue">🎷 Jazz</button>
      <button class="filter-btn" data-cat="Creole & Cajun">🍲 Food</button>
      <button class="filter-btn" data-cat="Historic Landmark">🏛 Landmarks</button>
    </div>
    <div class="stop-list" id="stopList"></div>
  </aside>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <div class="lightbox-inner">
    <button class="lightbox-close" id="lbClose" aria-label="Close">&times;</button>
    <button class="lightbox-arrow prev" id="lbPrev" aria-label="Previous">&#8249;</button>
    <img id="lbImg" src="" alt="">
    <button class="lightbox-arrow next" id="lbNext" aria-label="Next">&#8250;</button>
    <p class="lightbox-caption" id="lbCaption"></p>
  </div>
</div>

<script>
// ── Stop Data ──────────────────────────────────────────────────────────────
const stops = [
  {
    name: "Preservation Hall",
    category: "Jazz Venue",
    lat: 29.9583, lng: -90.0654,
    desc: "The world's most famous traditional jazz venue, operating since 1961 in a storied French Quarter building with nightly acoustic performances.",
    tip: "Doors open at 7:30 pm; shows at 8, 9 &amp; 10 pm nightly. Line up 30+ minutes early for best general-admission spots.",
    website: "https://www.preservationhall.com/",
    image: "Images/preservation-hall-1.jpg",
    images: ["Images/preservation-hall-1.jpg", "Images/preservation-hall-2.jpg"]
  },
  {
    name: "Maison Bourbon Jazz Club",
    category: "Jazz Venue",
    lat: 29.9579, lng: -90.0663,
    desc: "Dedicated to the preservation of jazz — a Bourbon Street stalwart since 1969 with live traditional jazz nightly in a brick-walled room.",
    tip: "Stand at the street-level window for free — the music spills out onto Bourbon. Small cover inside.",
    website: "https://www.maisonbourbon.com/",
    image: "Images/maison-bourbon-1.jpg"
  },
  {
    name: "The Spotted Cat Music Club",
    category: "Jazz Venue",
    lat: 29.9607, lng: -90.0594,
    desc: "Local favorite on Frenchmen Street with live jazz, blues, swing, and funk nightly — no cover and a welcoming neighborhood vibe.",
    tip: "Arrive early for a good spot. Cash bar, no table reservations. The street outside is itself alive with music most nights.",
    website: "https://www.spottedcatmusicclub.com/",
    image: "Images/spotted-cat-1.jpg"
  },
  {
    name: "Snug Harbor Jazz Bistro",
    category: "Jazz Venue",
    lat: 29.9606, lng: -90.0593,
    desc: "An intimate brick-walled bistro on Frenchmen Street hosting modern New Orleans jazz seven nights a week since the 1980s.",
    tip: "Ticketed shows — reserve in advance for weekend nights. Full Creole dinner menu served alongside the music.",
    website: "https://snugjazz.com/",
    image: "Images/snug-harbor-1.jpg"
  },
  {
    name: "Blue Nile",
    category: "Jazz Venue",
    lat: 29.9601, lng: -90.0602,
    desc: "The original music club that kickstarted Frenchmen Street's legendary music culture — three floors of funk, jazz, brass, and soul.",
    tip: "Check their live calendar. Balcony views of Frenchmen Street are outstanding on warm evenings. Late-night DJ sets upstairs.",
    website: "https://www.bluenilelive.com/",
    image: "Images/blue-nile-1.jpg"
  },
  {
    name: "Café du Monde",
    category: "Creole & Cajun",
    lat: 29.9576, lng: -90.0617,
    desc: "The legendary 24-hour French Market coffee stand, open since 1862, famous for beignets dusted in powdered sugar and chicory café au lait.",
    tip: "Expect a wait on weekends. Order beignets and wear dark clothes — the powdered sugar gets everywhere. Open every day but Christmas.",
    website: "https://shop.cafedumonde.com/",
    image: "Images/cafe-du-monde-1.jpg",
    images: ["Images/cafe-du-monde-1.jpg", "Images/cafe-du-monde-2.jpg"]
  },
  {
    name: "Antoine's Restaurant",
    category: "Creole & Cajun",
    lat: 29.9567, lng: -90.0664,
    desc: "America's oldest family-run restaurant (est. 1840), inventor of Oysters Rockefeller, with 14 unique dining rooms serving classic Creole cuisine.",
    tip: "Reservations strongly recommended. Ask to be seated in a historic dining room. The Oysters Rockefeller is non-negotiable.",
    website: "https://www.antoines.com/",
    image: "Images/antoines-1.jpg"
  },
  {
    name: "Brennan's Restaurant",
    category: "Creole & Cajun",
    lat: 29.9575, lng: -90.0667,
    desc: "Birthplace of Bananas Foster (1951) — a lavish pink-courtyarded French Quarter tradition with turtle soup, shrimp Arnaud, and flambéed desserts.",
    tip: "The weekend brunch is a New Orleans rite of passage. Reservations essential. Ask for courtyard seating if weather permits.",
    website: "https://www.brennansneworleans.com/",
    image: "Images/brennans-1.jpg"
  },
  {
    name: "Galatoire's Restaurant",
    category: "Creole & Cajun",
    lat: 29.9558, lng: -90.0706,
    desc: "An institution since 1905 serving elegant Creole classics — shrimp remoulade, trout meunière, and soufflé potatoes — in a chandelier-lit room.",
    tip: "No reservations on the beloved main floor. Friday lunch is a city tradition — arrive early and join the line. Business casual required.",
    website: "https://www.galatoires.com/",
    image: "Images/galatoires-1.jpg"
  },
  {
    name: "The Gumbo Shop",
    category: "Creole & Cajun",
    lat: 29.9583, lng: -90.0661,
    desc: "A French Quarter staple for authentic gumbo, crawfish étouffée, and red beans &amp; rice in a relaxed courtyard setting — great pre-jazz dining.",
    tip: "Try the Creole gumbo z'herbes or the seafood okra gumbo. Outdoor courtyard is lovely. Conveniently near Preservation Hall.",
    website: "https://www.gumboshop.com/",
    image: "Images/gumbo-shop-1.jpg"
  },
  {
    name: "Coop's Place",
    category: "Creole & Cajun",
    lat: 29.9567, lng: -90.0558,
    desc: "A beloved cash-only dive bar serving legendary Cajun food — rabbit &amp; sausage jambalaya, seafood gumbo, and red beans &amp; rice.",
    tip: "Cash only. No minors. Order the 'Coop's Taste Plate' to sample the greatest hits. Relaxed, no-frills, and deeply local.",
    website: "https://coopsplace.net/",
    image: "Images/coops-place-1.jpg"
  },
  {
    name: "Jackson Square",
    category: "Historic Landmark",
    lat: 29.9574, lng: -90.0631,
    desc: "The historic heart of New Orleans, framed by St. Louis Cathedral and the Pontalba Buildings — declared a National Historic Landmark in 1960.",
    tip: "Street artists, fortune tellers, and musicians set up here daily. Best photos from the Mississippi River levee behind the square.",
    website: "https://en.wikipedia.org/wiki/Jackson_Square_(New_Orleans)",
    image: "Images/jackson-square-1.jpg",
    images: ["Images/jackson-square-1.jpg", "Images/jackson-square-2.jpg"]
  },
  {
    name: "St. Louis Cathedral",
    category: "Historic Landmark",
    lat: 29.9580, lng: -90.0638,
    desc: "The oldest cathedral in continuous use in the United States (est. 1718), anchoring Jackson Square with three iconic white spires.",
    tip: "Free to enter. Guided tours available. The interior baroque frescoes and ornate altar are breathtaking. Check hours before visiting.",
    website: "https://www.stlouiscathedral.org/",
    image: "Images/st-louis-cathedral-1.jpg",
    images: ["Images/st-louis-cathedral-1.jpg", "Images/st-louis-cathedral-2.jpg"]
  },
  {
    name: "The Cabildo",
    category: "Historic Landmark",
    lat: 29.9576, lng: -90.0634,
    desc: "Where the Louisiana Purchase was signed in 1803 — now a Louisiana State Museum showcasing 300+ years of New Orleans history.",
    tip: "One of the finest history museums in the South. Check louisianastatemuseum.org for current hours and admission prices before visiting.",
    website: "https://louisianastatemuseum.org/museums/cabildo",
    image: "Images/the-cabildo-1.jpg"
  },
  {
    name: "French Market",
    category: "Historic Landmark",
    lat: 29.9569, lng: -90.0607,
    desc: "One of the oldest public markets in the US (est. 1791), stretching along the riverfront with local produce, Creole spices, crafts, and street food.",
    tip: "Open daily. Best visited in the morning. Great for chicory coffee, hot sauces, Creole spice mixes, and local artisan goods.",
    website: "https://frenchmarket.org/",
    image: "Images/french-market-1.jpg"
  }
];

// ── Category helpers ───────────────────────────────────────────────────────
function catClass(cat) {
  if (cat === "Jazz Venue") return "jazz";
  if (cat === "Creole & Cajun") return "creole";
  return "landmark";
}
function catColor(cat) {
  if (cat === "Jazz Venue") return "#9b7fe8";
  if (cat === "Creole & Cajun") return "#f07a4a";
  return "#4ab8c8";
}
function markerIcon(cat) {
  const col = catColor(cat);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 42">
    <filter id="s"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity=".4"/></filter>
    <path d="M15 1C8.4 1 3 6.4 3 13c0 9.5 12 27 12 27s12-17.5 12-27C27 6.4 21.6 1 15 1z" fill="${col}" stroke="rgba(0,0,0,.3)" stroke-width="1" filter="url(#s)"/>
    <circle cx="15" cy="13" r="5" fill="rgba(0,0,0,.35)"/>
  </svg>`;
  return L.divIcon({
    className: "",
    html: `<div style="width:30px;height:42px">${svg}</div>`,
    iconSize: [30, 42],
    iconAnchor: [15, 42],
    popupAnchor: [0, -44]
  });
}

// ── Lightbox ───────────────────────────────────────────────────────────────
let lbPhotos = [], lbIdx = 0, lbStopName = "";
const lightbox = document.getElementById("lightbox");
const lbImg    = document.getElementById("lbImg");
const lbCaption= document.getElementById("lbCaption");
const lbClose  = document.getElementById("lbClose");
const lbPrev   = document.getElementById("lbPrev");
const lbNext   = document.getElementById("lbNext");

function openLightbox(photos, idx, stopName) {
  lbPhotos = photos; lbIdx = idx; lbStopName = stopName;
  showLbSlide();
  lightbox.classList.add("open");
  document.addEventListener("keydown", lbKeyHandler);
}
function closeLightbox() {
  lightbox.classList.remove("open");
  document.removeEventListener("keydown", lbKeyHandler);
}
function showLbSlide() {
  lbImg.src = lbPhotos[lbIdx];
  lbCaption.textContent = lbPhotos.length > 1
    ? `${lbStopName} — ${lbIdx + 1}/${lbPhotos.length}`
    : lbStopName;
  lbPrev.classList.toggle("hidden", lbPhotos.length <= 1);
  lbNext.classList.toggle("hidden", lbPhotos.length <= 1);
}
function lbKeyHandler(e) {
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft" && lbPhotos.length > 1) { lbIdx = (lbIdx - 1 + lbPhotos.length) % lbPhotos.length; showLbSlide(); }
  if (e.key === "ArrowRight" && lbPhotos.length > 1) { lbIdx = (lbIdx + 1) % lbPhotos.length; showLbSlide(); }
}
lbClose.onclick = closeLightbox;
lightbox.onclick = (e) => { if (e.target === lightbox) closeLightbox(); };
lbPrev.onclick = (e) => { e.stopPropagation(); lbIdx = (lbIdx - 1 + lbPhotos.length) % lbPhotos.length; showLbSlide(); };
lbNext.onclick = (e) => { e.stopPropagation(); lbIdx = (lbIdx + 1) % lbPhotos.length; showLbSlide(); };

// ── Build popup HTML ───────────────────────────────────────────────────────
function buildPopupHtml(stop, idx) {
  const photos = stop.images || (stop.image ? [stop.image] : []);
  const cls = catClass(stop.category);
  const badgeCls = `badge-${cls}`;

  let mediaHtml = "";
  if (stop.image) {
    const countPill = photos.length > 1
      ? `<div class="popup-photo-count">1/${photos.length}</div>` : "";
    const thumbs = photos.length > 1
      ? `<div class="popup-thumbs">${photos.map((p,i) =>
          `<img src="${p}" alt="photo ${i+1}" onclick="openLightbox(${JSON.stringify(photos)},${i},${JSON.stringify(stop.name)});event.stopPropagation()">`
        ).join("")}</div>` : "";
    mediaHtml = `
      <div class="popup-media">
        <button onclick="openLightbox(${JSON.stringify(photos)},0,${JSON.stringify(stop.name)})" style="border:none;padding:0;cursor:pointer;display:block;width:100%">
          <img src="${stop.image}" alt="${stop.name}" onerror="this.parentElement.style.display='none'">
        </button>
        ${countPill}
        <div class="popup-expand">⤢</div>
      </div>${thumbs}`;
  }

  const tipHtml = stop.tip ? `<div class="popup-tip">💡 ${stop.tip}</div>` : "";
  const websiteLink = stop.website
    ? `<a href="${stop.website}" target="_blank" rel="noopener" class="popup-link" onclick="event.stopPropagation()">Website</a>` : "";
  const directionsLink = `<a href="https://www.google.com/maps/dir/?api=1&destination=${stop.lat},${stop.lng}" target="_blank" rel="noopener" class="popup-link directions" onclick="event.stopPropagation()">Directions</a>`;

  return `<div class="popup-card">
    ${mediaHtml}
    <div class="popup-body">
      <div class="popup-badge ${badgeCls}">${stop.category}</div>
      <div class="popup-title">${stop.name}</div>
      <div class="popup-desc">${stop.desc}</div>
      ${tipHtml}
      <div class="popup-actions">${websiteLink}${directionsLink}</div>
    </div>
  </div>`;
}

// ── Map ────────────────────────────────────────────────────────────────────
const map = L.map("map", { center: [29.9585, -90.0635], zoom: 14, zoomControl: false });
L.control.zoom({ position: "bottomright" }).addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

// Route lines (3 category paths)
const jazzCoords = stops.filter(s => s.category === "Jazz Venue").map(s => [s.lat, s.lng]);
const foodCoords = stops.filter(s => s.category === "Creole & Cajun").map(s => [s.lat, s.lng]);
const landCoords = stops.filter(s => s.category === "Historic Landmark").map(s => [s.lat, s.lng]);
L.polyline(jazzCoords,  { color: "#9b7fe8", weight: 2.5, opacity: 0.55, dashArray: "6 5" }).addTo(map);
L.polyline(foodCoords,  { color: "#f07a4a", weight: 2.5, opacity: 0.55, dashArray: "6 5" }).addTo(map);
L.polyline(landCoords,  { color: "#4ab8c8", weight: 2.5, opacity: 0.55, dashArray: "6 5" }).addTo(map);

// Markers
const markers = stops.map((stop, idx) => {
  const marker = L.marker([stop.lat, stop.lng], { icon: markerIcon(stop.category) })
    .bindPopup(buildPopupHtml(stop, idx), {
      maxWidth: 330, minWidth: 300, maxHeight: 380,
      autoPanPadding: L.point(40, 40)
    })
    .bindTooltip(stop.name, { permanent: false, direction: "top", offset: [0, -42] })
    .addTo(map);
  return marker;
});

// ── Sidebar stop list ──────────────────────────────────────────────────────
const stopList = document.getElementById("stopList");
stops.forEach((stop, idx) => {
  const cls = catClass(stop.category);
  const photos = stop.images || (stop.image ? [stop.image] : []);
  const thumbHtml = stop.image
    ? `<div class="stop-thumb-wrap">
        <img class="stop-thumb" src="${stop.image}" alt="${stop.name}"
          onclick="openLightbox(${JSON.stringify(photos)},0,${JSON.stringify(stop.name)});event.stopPropagation()">
        ${photos.length > 1 ? `<div class="thumb-count">▤ ${photos.length}</div>` : ""}
      </div>`
    : "";

  const row = document.createElement("div");
  row.className = "stop-row";
  row.dataset.cat = stop.category;
  row.innerHTML = `${thumbHtml}
    <div class="stop-info">
      <div class="stop-num">${idx + 1}</div>
      <div class="stop-name">${stop.name}</div>
      <div class="stop-cat cat-${cls}">${stop.category}</div>
    </div>`;
  row.addEventListener("click", () => {
    map.setView([stop.lat, stop.lng], 16, { animate: true });
    setTimeout(() => markers[idx].openPopup(), 400);
  });
  stopList.appendChild(row);
});

// ── Filter buttons ─────────────────────────────────────────────────────────
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const cat = btn.dataset.cat;
    document.querySelectorAll(".stop-row").forEach(row => {
      row.classList.toggle("hidden", cat !== "all" && row.dataset.cat !== cat);
    });
    markers.forEach((marker, idx) => {
      const visible = cat === "all" || stops[idx].category === cat;
      if (visible) {
        if (!map.hasLayer(marker)) marker.addTo(map);
      } else {
        if (map.hasLayer(marker)) marker.removeFrom(map);
      }
    });
  });
});
</script>
</body>
</html>
