<style>

  /* ── Header ── */
  .app-header { background: #14141c; border-bottom: 1px solid #2a2a3a; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; z-index: 1000; }

  .header-text p { font-size: 11px; color: #8888aa; margin-top: 1px; }
  .legend { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #aaa; white-space: nowrap; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* ── Main layout ── */
  .app-body { display: flex; flex: 1; overflow: hidden; }
  #map { flex: 1; }

  /* ── Sidebar ── */
  .sidebar { width: 300px; background: #14141c; border-left: 1px solid #2a2a3a; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
  .sidebar-header { padding: 12px 14px; border-bottom: 1px solid #2a2a3a; }
  .sidebar-header h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: #8888aa; font-weight: 600; }
  .sidebar-filter { padding: 10px 14px; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid #2a2a3a; }
  .filter-btn { font-size: 10px; padding: 4px 9px; border-radius: 20px; border: 1px solid #333; background: #1e1e2a; color: #aaa; cursor: pointer; transition: all .15s; }
  .filter-btn:hover, .filter-btn.active { border-color: currentColor; background: transparent; }
  .filter-btn[data-cat="all"].active { color: #e8e8f0; border-color: #e8e8f0; }
  .filter-btn[data-cat="EV Fast Charger"].active { color: #38bdf8; border-color: #38bdf8; }
  .filter-btn[data-cat="Scenic Landmark"].active { color: #f5d97a; border-color: #f5d97a; }
  .filter-btn[data-cat="Food & Coffee"].active { color: #f07a4a; border-color: #f07a4a; }
  .stop-list { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #333 transparent; }
  .stop-row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; border-bottom: 1px solid #1e1e2a; transition: background .12s; }
  .stop-row:hover { background: #1e1e2a; }
  .stop-row.hidden { display: none; }
  .stop-thumb-wrap { position: relative; flex-shrink: 0; width: 46px; height: 46px; }
  .stop-thumb { width: 46px; height: 46px; object-fit: cover; border-radius: 6px; cursor: pointer; }
  .thumb-count { position: absolute; bottom: 2px; right: 2px; background: rgba(0,0,0,.7); color: #fff; font-size: 9px; border-radius: 3px; padding: 1px 3px; pointer-events: none; }
  .stop-info { flex: 1; min-width: 0; }
  .stop-num { font-size: 10px; color: #666; }
  .stop-name { font-size: 13px; font-weight: 600; color: #e8e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stop-cat { font-size: 10px; margin-top: 2px; }

  /* ── Popup reset ── */
  .leaflet-popup-content-wrapper { background: #16161e; border: 1px solid #2a2a3a; border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.6); padding: 0; overflow: hidden; }
  .leaflet-popup-tip { background: #16161e; }
  .leaflet-popup-content { margin: 0; width: min(300px, 88vw) !important; }

  /* ── Popup card ── */
  .popup-card { overflow: hidden; border-radius: 10px; }
  .popup-media { position: relative; overflow: hidden; }
  .popup-media img { width: 100%; height: 150px; object-fit: cover; display: block; cursor: pointer; }
  .popup-expand { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 2px 5px; border-radius: 4px; pointer-events: none; }
  .popup-photo-count { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; pointer-events: none; }
  .popup-thumbs { display: flex; gap: 4px; padding: 5px 5px 3px; overflow-x: auto; scrollbar-width: thin; scrollbar-color: #333 transparent; }
  .popup-thumbs img { width: 46px; height: 34px; object-fit: cover; border-radius: 4px; cursor: pointer; flex-shrink: 0; border: 1.5px solid transparent; transition: border-color .12s; }
  .popup-thumbs img:hover { border-color: #38bdf8; }
  .popup-body { padding: 10px 12px 10px; }
  .popup-badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 600; margin-bottom: 6px; }
  .popup-title { font-size: 15px; font-weight: 700; color: #f0f0f8; line-height: 1.3; margin-bottom: 5px; }
  .popup-desc { font-size: 12px; color: #aaa; line-height: 1.5; margin-bottom: 6px; }
  .popup-tip { font-size: 11px; color: #c8b870; background: rgba(245,217,122,.08); border-left: 2px solid #f5d97a; padding: 4px 8px; border-radius: 0 4px 4px 0; margin-bottom: 8px; line-height: 1.4; }
  .popup-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .popup-link { font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 1px solid #333; color: #aaa; text-decoration: none; white-space: nowrap; transition: all .12s; }
  .popup-link:hover { border-color: #38bdf8; color: #38bdf8; }
  .popup-link.directions { border-color: #4ab8c8; color: #4ab8c8; }
  .popup-link.directions:hover { background: rgba(74,184,200,.1); }

  /* ── Lightbox ── */
  .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 9999; justify-content: center; align-items: center; }
  .lightbox.open { display: flex; }
  .lightbox-inner { position: relative; max-width: min(90vw, 900px); max-height: 90vh; }
  .lightbox-inner img { max-width: 100%; max-height: 80vh; object-fit: contain; border-radius: 6px; display: block; }
  .lightbox-caption { text-align: center; color: #ccc; font-size: 13px; margin-top: 10px; }
  .lightbox-close { position: absolute; top: -36px; right: 0; color: #fff; font-size: 26px; cursor: pointer; line-height: 1; background: none; border: none; }
  .lightbox-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.55); color: #fff; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .lightbox-arrow.prev { left: -48px; }
  .lightbox-arrow.next { right: -48px; }
  .lightbox-arrow.hidden { display: none; }

  /* ── Category colours ── */
  .cat-ev { color: #38bdf8; }
  .cat-scenic { color: #f5d97a; }
  .cat-food { color: #f07a4a; }

  .badge-scenic { background: rgba(245,217,122,.15); color: #f5d97a; }
  .badge-food { background: rgba(240,122,74,.15); color: #f07a4a; }

  /* ── Mobile ── */
  @media (max-width: 700px) {
    .sidebar { display: none; }
  }
  @media (max-width: 560px) {
    .leaflet-popup { max-width: 92vw !important; }
    .leaflet-popup-content-wrapper { max-width: 92vw; }

    .popup-media img { height: 116px !important; }
    .lightbox-arrow.prev { left: -30px; }
    .lightbox-arrow.next { right: -30px; }
  }
  @media (max-width: 400px) {
    .legend { display: none; }
  }

// ── Category helpers ───────────────────────────────────────────────────────
function catClass(cat) {
  if (cat === "EV Fast Charger") return "ev";
  if (cat === "Food & Coffee") return "food";
  return "scenic";
}
function catColor(cat) {
  if (cat === "EV Fast Charger") return "#38bdf8";
  if (cat === "Food & Coffee") return "#f07a4a";
  return "#f5d97a";
}
function markerIcon(cat) {
  const col = catColor(cat);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 42">
    <filter id="s"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity=".4"/></filter>
    <path d="M15 1C8.4 1 3 6.4 3 13c0 9.5 12 27 12 27s12-17.5 12-27C27 6.4 21.6 1 15 1z" fill="${col}" stroke="rgba(0,0,0,.3)" stroke-width="1" filter="url(#s)"/>
    <circle cx="15" cy="13" r="5" fill="rgba(0,0,0,.35)"/>
  </svg>`;
  return L.divIcon({
    className: "",
    html: `<div style="width:30px;height:42px">${svg}</div>`,
    iconSize: [30, 42],
    iconAnchor: [15, 42],
    popupAnchor: [0, -44]
  });
}

// ── Lightbox ───────────────────────────────────────────────────────────────
let lbPhotos = [], lbIdx = 0, lbStopName = "";
const lightbox = document.getElementById("lightbox");
const lbImg    = document.getElementById("lbImg");
const lbCaption= document.getElementById("lbCaption");
const lbClose  = document.getElementById("lbClose");
const lbPrev   = document.getElementById("lbPrev");
const lbNext   = document.getElementById("lbNext");

function openLightbox(photos, idx, stopName) {
  lbPhotos = photos; lbIdx = idx; lbStopName = stopName;
  showLbSlide();
  lightbox.classList.add("open");
  document.addEventListener("keydown", lbKeyHandler);
}
function closeLightbox() {
  lightbox.classList.remove("open");
  document.removeEventListener("keydown", lbKeyHandler);
}
function showLbSlide() {
  lbImg.src = lbPhotos[lbIdx];
  lbCaption.textContent = lbPhotos.length > 1
    ? `${lbStopName} — ${lbIdx + 1}/${lbPhotos.length}`
    : lbStopName;
  lbPrev.classList.toggle("hidden", lbPhotos.length <= 1);
  lbNext.classList.toggle("hidden", lbPhotos.length <= 1);
}
function lbKeyHandler(e) {
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft" && lbPhotos.length > 1) { lbIdx = (lbIdx - 1 + lbPhotos.length) % lbPhotos.length; showLbSlide(); }
  if (e.key === "ArrowRight" && lbPhotos.length > 1) { lbIdx = (lbIdx + 1) % lbPhotos.length; showLbSlide(); }
}
lbClose.onclick = closeLightbox;
lightbox.onclick = (e) => { if (e.target === lightbox) closeLightbox(); };
lbPrev.onclick = (e) => { e.stopPropagation(); lbIdx = (lbIdx - 1 + lbPhotos.length) % lbPhotos.length; showLbSlide(); };
lbNext.onclick = (e) => { e.stopPropagation(); lbIdx = (lbIdx + 1) % lbPhotos.length; showLbSlide(); };

// ── Build popup HTML ───────────────────────────────────────────────────────
function buildPopupHtml(stop) {
  const photos = stop.images || (stop.image ? [stop.image] : []);
  const cls = catClass(stop.category);
  const badgeCls = `badge-${cls}`;

  let mediaHtml = "";
  if (stop.image) {
    const countPill = photos.length > 1
      ? `<div class="popup-photo-count">1/${photos.length}</div>` : "";
    const thumbs = photos.length > 1
      ? `<div class="popup-thumbs">${photos.map((p,i) =>
          `<img src="${p}" alt="photo ${i+1}" onclick="openLightbox(${JSON.stringify(photos)},${i},${JSON.stringify(stop.name)});event.stopPropagation()">`
        ).join("")}</div>` : "";
    mediaHtml = `
      <div class="popup-media">
        <button onclick="openLightbox(${JSON.stringify(photos)},0,${JSON.stringify(stop.name)})" style="border:none;padding:0;cursor:pointer;display:block;width:100%">
          <img src="${stop.image}" alt="${stop.name}" onerror="this.parentElement.style.display='none'">
        </button>
        ${countPill}
        <div class="popup-expand">⤢</div>
      </div>${thumbs}`;
  }

  const tipHtml = stop.tip ? `<div class="popup-tip">💡 ${stop.tip}</div>` : "";
  const websiteLink = stop.website
    ? `<a href="${stop.website}" target="_blank" rel="noopener" class="popup-link" onclick="event.stopPropagation()">Website</a>` : "";
  const directionsLink = `<a href="https://www.google.com/maps/dir/?api=1&destination=${stop.lat},${stop.lng}" target="_blank" rel="noopener" class="popup-link directions" onclick="event.stopPropagation()">Directions</a>`;

  return `<div class="popup-card">
    ${mediaHtml}
    <div class="popup-body">
      <div class="popup-badge ${badgeCls}">${stop.category}</div>
      <div class="popup-title">${stop.name}</div>
      <div class="popup-desc">${stop.desc}</div>
      ${tipHtml}
      <div class="popup-actions">${websiteLink}${directionsLink}</div>
    </div>
  </div>`;
}

// ── Map ────────────────────────────────────────────────────────────────────
const map = L.map("map", { center: [35.9, -120.9], zoom: 7, zoomControl: false });
L.control.zoom({ position: "bottomright" }).addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

// Single route line in driving order (SF → LA)
const routeCoords = stops.map(s => [s.lat, s.lng]);
L.polyline(routeCoords, { color: "#e8e8f0", weight: 2.5, opacity: 0.35, dashArray: "6 5" }).addTo(map);

// Markers
const markers = stops.map((stop) => {
  const marker = L.marker([stop.lat, stop.lng], { icon: markerIcon(stop.category) })
    .bindPopup(buildPopupHtml(stop), {
      maxWidth: 330, minWidth: 300, maxHeight: 380,
      autoPanPadding: L.point(40, 40)
    })
    .bindTooltip(stop.name, { permanent: false, direction: "top", offset: [0, -42] })
    .addTo(map);
  return marker;
});

// ── Sidebar stop list ──────────────────────────────────────────────────────
const stopList = document.getElementById("stopList");
stops.forEach((stop, idx) => {
  const cls = catClass(stop.category);
  const photos = stop.images || (stop.image ? [stop.image] : []);
  const thumbHtml = stop.image
    ? `<div class="stop-thumb-wrap">
        <img class="stop-thumb" src="${stop.image}" alt="${stop.name}"
          onclick="openLightbox(${JSON.stringify(photos)},0,${JSON.stringify(stop.name)});event.stopPropagation()">
        ${photos.length > 1 ? `<div class="thumb-count">▤ ${photos.length}</div>` : ""}
      </div>`
    : "";

  const row = document.createElement("div");
  row.className = "stop-row";
  row.dataset.cat = stop.category;
  row.innerHTML = `${thumbHtml}
    <div class="stop-info">
      <div class="stop-num">${idx + 1}</div>
      <div class="stop-name">${stop.name}</div>
      <div class="stop-cat cat-${cls}">${stop.category}</div>
    </div>`;
  row.addEventListener("click", () => {
    map.setView([stop.lat, stop.lng], 13, { animate: true });
    setTimeout(() => markers[idx].openPopup(), 400);
  });
  stopList.appendChild(row);
});

// ── Filter buttons ─────────────────────────────────────────────────────────
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const cat = btn.dataset.cat;
    document.querySelectorAll(".stop-row").forEach(row => {
      row.classList.toggle("hidden", cat !== "all" && row.dataset.cat !== cat);
    });
    markers.forEach((marker, idx) => {
      const visible = cat === "all" || stops[idx].category === cat;
      if (visible) {
        if (!map.hasLayer(marker)) marker.addTo(map);
      } else {
        if (map.hasLayer(marker)) marker.removeFrom(map);
      }
    });
  });
});
</script>
</body>
</html>
