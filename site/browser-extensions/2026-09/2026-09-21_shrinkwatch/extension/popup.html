<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ShrinkWatch</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="shrinkwatch-popup">
    <header class="shrinkwatch-popup__header">
      <span class="shrinkwatch-popup__mark" aria-hidden="true"></span>
      <div>
        <h1>ShrinkWatch</h1>
        <p class="shrinkwatch-popup__tagline">Same price, smaller box? You'll know.</p>
      </div>
    </header>

    <section class="shrinkwatch-popup__section" id="on-this-page">
      <h2>On this page</h2>
      <div class="shrinkwatch-popup__loading" data-role="page-loading">Checking this tab&hellip;</div>
    </section>

    <section class="shrinkwatch-popup__section" id="tracked-products">
      <div class="shrinkwatch-popup__section-head">
        <h2>Tracked products</h2>
        <span class="shrinkwatch-popup__count" data-role="tracked-count"></span>
      </div>
      <ul class="shrinkwatch-popup__list" data-role="tracked-list"></ul>
      <p class="shrinkwatch-popup__upgrade" data-role="upgrade-banner" hidden>
        Free plan tracks 8 products. Upgrade for unlimited tracking and cross-device sync.
      </p>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
