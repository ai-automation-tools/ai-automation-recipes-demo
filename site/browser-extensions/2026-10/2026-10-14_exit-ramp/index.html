<!doctype html>
<html lang="en">

  <meta charset="utf-8">

  <title>Exit Ramp demo</title>
  <link rel="stylesheet" href="extension/popup.css">
  <link rel="stylesheet" href="style.css">

<body>
  <p class="demo-hint">Demo of the Exit Ramp extension. Click the <strong>ER</strong> button in the toolbar, then follow the green-marked exit through the cancel flow.</p>

  <div class="browser" role="application" aria-label="Mock browser window">
    <div class="titlebar">
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="tab" id="tab-title">Account · Streamly</span>
    </div>
    <div class="toolbar">
      <span class="nav" aria-hidden="true">&larr; &rarr; &#8635;</span>
      <div class="urlbar" id="urlbar">https://account.streamly.tv/account</div>
      <button type="button" class="ext-btn" id="ext-btn" aria-expanded="false" aria-controls="popup-panel" title="Exit Ramp">ER</button>
    </div>

    <div class="viewport">
      <article class="site" id="mock-page" aria-label="Mock subscription site"></article>

      <!-- Same markup as extension/popup.html -->
      <div class="popup-panel" id="popup-panel" hidden>
        <main class="xr-popup">
          <header class="xr-head">
            <h1>Exit Ramp</h1>
            <span id="xr-site" class="xr-site"></span>
          </header>
          <p id="xr-status" class="xr-status"></p>
          <h2>On this page</h2>
          <ul id="xr-findings" class="xr-findings"></ul>
          <h2>Your path so far</h2>
          <ol id="xr-steps" class="xr-steps"></ol>
          <footer class="xr-foot">
            <button id="xr-copy" type="button">Copy evidence log</button>
            <button id="xr-clear" type="button" class="xr-ghost">Clear this site</button>
            <span id="xr-note" class="xr-note" role="status"></span>
          </footer>
          <p id="xr-others" class="xr-others"></p>
        </main>
      </div>
    </div>
  </div>
