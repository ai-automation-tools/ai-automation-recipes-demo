<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Labyrinth</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #03030e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }
    #hud {
      display: flex;
      gap: 18px;
      padding: 6px 14px;
      font-size: 15px;
      letter-spacing: 1px;
      color: #0ff;
      text-shadow: 0 0 8px #0ff;
      margin-bottom: 5px;
    }
    .hi { display: flex; gap: 5px; align-items: baseline; }
    .hl { color: #057; font-size: 11px; letter-spacing: 1.5px; }
    #game-wrap { position: relative; }
    #canvas {
      display: block;
      border: 2px solid #0ff;
      box-shadow: 0 0 20px #0ff5, 0 0 55px #0ff2;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 3, 20, 0.91);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    #ov-title {
      font-size: clamp(1.2em, 5vw, 2em);
      color: #0ff;
      text-shadow: 0 0 18px #0ff, 0 0 40px #0ff8;
      letter-spacing: 5px;
      text-align: center;
    }
    #ov-msg {
      font-size: clamp(0.68em, 2vw, 0.88em);
      color: #7af;
      text-align: center;
      max-width: 85%;
      line-height: 1.6;
    }
    #ov-btn {
      padding: 11px 30px;
      font-family: inherit;
      font-size: 0.88em;
      letter-spacing: 3px;
      background: transparent;
      border: 2px solid #0ff;
      color: #0ff;
      cursor: pointer;
      text-shadow: 0 0 7px #0ff;
      box-shadow: 0 0 14px #0ff5, inset 0 0 8px #0ff1;
      border-radius: 3px;
      transition: background 0.12s, box-shadow 0.12s;
    }
    #ov-btn:hover { background: #0ff2; box-shadow: 0 0 24px #0ff, inset 0 0 14px #0ff3; }
    #dpad {
      margin-top: 10px;
      display: none;
    }
    .dg {
      display: grid;
      grid-template-areas: ". u ." "l . r" ". d .";
      grid-template-columns: 58px 58px 58px;
      grid-template-rows: 58px 58px 58px;
      gap: 4px;
    }
    .dpb {
      width: 54px; height: 54px;
      background: rgba(0,255,255,0.07);
      border: 2px solid rgba(0,255,255,0.35);
      border-radius: 10px;
      color: #0ff;
      font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.08s, border-color 0.08s;
    }
    .dpb:active { background: rgba(0,255,255,0.22); border-color: #0ff; }
  </style>
</head>
<body>
  <div id="hud">
    <span class="hi"><span class="hl">LEVEL</span><span id="hl">1</span></span>
    <span class="hi"><span class="hl">SCORE</span><span id="hs">0</span></span>
    <span class="hi"><span class="hl">TIME</span><span id="ht">60</span></span>
    <span class="hi"><span class="hl">GEMS</span><span id="hg">0</span></span>
  </div>
  <div id="game-wrap">
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <div id="ov-title">NEON LABYRINTH</div>
      <div id="ov-msg">Navigate glowing corridors · Collect energy gems<br>Reach the ★ exit portal before time runs out!<br><br><span style="color:#057;font-size:0.9em">WASD / Arrows · R to restart · Swipe on mobile</span></div>
      <button id="ov-btn">START GAME</button>
    </div>
  </div>
  <div id="dpad">
    <div class="dg">
      <div class="dpb" style="grid-area:u" data-dx="0"  data-dy="-1">▲</div>
      <div class="dpb" style="grid-area:l" data-dx="-1" data-dy="0">◄</div>
      <div class="dpb" style="grid-area:r" data-dx="1"  data-dy="0">►</div>
      <div class="dpb" style="grid-area:d" data-dx="0"  data-dy="1">▼</div>
    </div>
  </div>

  <script>
  // Neon Labyrinth — genre: maze
  // Controls: WASD / Arrow Keys to navigate, R to restart after game-over.
  // Mobile: swipe on canvas OR use the on-screen D-pad.
  // Goal: reach the ★ exit portal; collect yellow gems for bonus points.

  // ── DOM refs — <script> is last in <body>, so all elements already exist ──
  const canvas  = document.getElementById('canvas');
  const ctx     = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovMsg   = document.getElementById('ov-msg');
  const ovBtn   = document.getElementById('ov-btn');
  const elLvl   = document.getElementById('hl');
  const elScore = document.getElementById('hs');
  const elTime  = document.getElementById('ht');
  const elGems  = document.getElementById('hg');
  const dpad    = document.getElementById('dpad');

  // ── Game state ───────────────────────────────────────────────────────────
  let gState  = 'title';   // title | playing | levelclear | gameover
  let level   = 1;
  let score   = 0;
  let gemsCt  = 0;
  let tLeft   = 60;
  let ticker  = null;
  let phase   = 0;         // animation phase counter (radians)

  // ── Maze state ───────────────────────────────────────────────────────────
  let COLS = 10, ROWS = 8, CELL = 32;
  let grid = [];           // grid[r][c] = {n,s,e,w,v}
  let px = 0, py = 0;     // player grid coords
  let ex = 0, ey = 0;     // exit grid coords
  let gems = [];           // [{gx,gy,done}]

  // ── Responsive layout ────────────────────────────────────────────────────
  function computeLayout() {
    COLS = Math.min(10 + (level - 1) * 2, 22);
    ROWS = Math.min(8  + (level - 1) * 2, 16);
    const maxW = Math.min(window.innerWidth  - 12, 740);
    const maxH = Math.min(window.innerHeight - 150, 580);
    CELL = Math.max(14, Math.min(40, Math.min(
      Math.floor(maxW / COLS),
      Math.floor(maxH / ROWS)
    )));
    canvas.width  = COLS * CELL;
    canvas.height = ROWS * CELL;
  }

  // ── Maze generation: iterative DFS (recursive backtracker) ───────────────
  function buildMaze() {
    const g = [];
    for (let r = 0; r < ROWS; r++) {
      g[r] = [];
      for (let c = 0; c < COLS; c++) {
        g[r][c] = { n:true, s:true, e:true, w:true, v:false };
      }
    }
    const stack = [[0, 0]];
    g[0][0].v = true;
    while (stack.length) {
      const [r, c] = stack[stack.length - 1];
      const nb = [];
      if (r > 0      && !g[r-1][c].v) nb.push([r-1, c,  'n', 's']);
      if (r < ROWS-1 && !g[r+1][c].v) nb.push([r+1, c,  's', 'n']);
      if (c > 0      && !g[r][c-1].v) nb.push([r,   c-1,'w', 'e']);
      if (c < COLS-1 && !g[r][c+1].v) nb.push([r,   c+1,'e', 'w']);
      if (!nb.length) { stack.pop(); continue; }
      const [nr, nc, wd, wo] = nb[Math.floor(Math.random() * nb.length)];
      g[r][c][wd]      = false;
      g[nr][nc][wo]    = false;
      g[nr][nc].v      = true;
      stack.push([nr, nc]);
    }
    return g;
  }

  // ── Gem placement ────────────────────────────────────────────────────────
  function placeGems() {
    const n    = 3 + level;
    const used = new Set(['0,0', `${COLS-1},${ROWS-1}`]);
    const res  = [];
    let tries  = 0;
    while (res.length < n && tries < 3000) {
      tries++;
      const gx = Math.floor(Math.random() * COLS);
      const gy = Math.floor(Math.random() * ROWS);
      const k  = `${gx},${gy}`;
      if (!used.has(k)) { used.add(k); res.push({ gx, gy, done: false }); }
    }
    return res;
  }

  // ── Level start ──────────────────────────────────────────────────────────
  function startLevel() {
    computeLayout();
    grid   = buildMaze();
    px = 0; py = 0;
    ex = COLS - 1; ey = ROWS - 1;
    gems   = placeGems();
    gemsCt = 0;
    tLeft  = Math.round(Math.max(25, 55 + COLS * ROWS * 0.10 - (level - 1) * 4));
    updateHUD();
    overlay.style.display = 'none';
    gState = 'playing';
    if (ticker) clearInterval(ticker);
    ticker = setInterval(timerTick, 1000);
  }

  function timerTick() {
    if (gState !== 'playing') return;
    tLeft = Math.max(0, tLeft - 1);
    elTime.textContent = tLeft;
    elTime.style.color = tLeft <= 10 ? '#f55' : '#0ff';
    if (tLeft === 0) endGame(false);
  }

  function updateHUD() {
    elLvl.textContent   = level;
    elScore.textContent = score;
    elTime.textContent  = tLeft;
    elGems.textContent  = gemsCt;
    elTime.style.color  = tLeft <= 10 ? '#f55' : '#0ff';
  }

  // ── Movement ─────────────────────────────────────────────────────────────
  function move(dx, dy) {
    if (gState !== 'playing') return;
    const wall = dx === 1 ? 'e' : dx === -1 ? 'w' : dy === 1 ? 's' : 'n';
    if (grid[py][px][wall]) return;     // blocked by wall
    px += dx; py += dy;
    // collect gems
    for (const g of gems) {
      if (!g.done && g.gx === px && g.gy === py) {
        g.done = true; gemsCt++; score += 50;
        updateHUD();
      }
    }
    // reached exit?
    if (px === ex && py === ey) endGame(true);
  }

  // ── End game ─────────────────────────────────────────────────────────────
  function endGame(win) {
    if (ticker) { clearInterval(ticker); ticker = null; }
    if (win) {
      const bonus = tLeft * 10;
      score += bonus;
      updateHUD();
      gState = 'levelclear';
      ovTitle.textContent = '✦  LEVEL CLEAR  ✦';
      ovMsg.textContent   = `Time bonus +${bonus}  ·  Total score: ${score}`;
      ovBtn.textContent   = 'NEXT LEVEL';
    } else {
      gState = 'gameover';
      ovTitle.textContent = '✦  GAME OVER  ✦';
      ovMsg.textContent   = `You reached level ${level}  ·  Final score: ${score}\n\nPress R or click to try again.`;
      ovBtn.textContent   = 'PLAY AGAIN';
    }
    overlay.style.display = 'flex';
  }

  // ── Drawing helpers ───────────────────────────────────────────────────────
  function drawMaze() {
    ctx.save();
    ctx.strokeStyle = '#0ff';
    ctx.shadowColor  = '#0ff';
    ctx.shadowBlur   = 7;
    ctx.lineWidth    = 2;
    ctx.lineCap      = 'square';
    // batch all wall segments into one path for performance
    ctx.beginPath();
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = grid[r][c];
        const x = c * CELL, y = r * CELL;
        if (r === 0 && cell.n) { ctx.moveTo(x, y);        ctx.lineTo(x + CELL, y); }
        if (c === 0 && cell.w) { ctx.moveTo(x, y);        ctx.lineTo(x, y + CELL); }
        if (cell.s)            { ctx.moveTo(x, y + CELL); ctx.lineTo(x + CELL, y + CELL); }
        if (cell.e)            { ctx.moveTo(x + CELL, y); ctx.lineTo(x + CELL, y + CELL); }
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawExit() {
    const cx = ex * CELL + CELL / 2;
    const cy = ey * CELL + CELL / 2;
    const p  = 0.55 + 0.45 * Math.sin(phase * 1.8);
    ctx.save();
    ctx.shadowColor = '#c0f';
    ctx.shadowBlur  = 22 * p;
    // outer ring
    ctx.strokeStyle = `rgba(210,0,255,${0.75 * p})`;
    ctx.lineWidth   = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * 0.38, 0, Math.PI * 2);
    ctx.stroke();
    // inner glow fill
    ctx.fillStyle = `rgba(150,0,220,${0.2 * p})`;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * 0.30, 0, Math.PI * 2);
    ctx.fill();
    // rotating inner ring
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(phase * 0.7);
    ctx.strokeStyle = `rgba(255,80,255,${0.5 * p})`;
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.arc(0, 0, CELL * 0.32, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    // star
    ctx.fillStyle = `rgba(240,120,255,${0.85 * p + 0.15})`;
    ctx.font = `bold ${Math.max(10, Math.floor(CELL * 0.38))}px monospace`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('★', cx, cy);
    ctx.restore();
  }

  function drawGems() {
    ctx.save();
    for (const g of gems) {
      if (g.done) continue;
      const cx = g.gx * CELL + CELL / 2;
      const cy = g.gy * CELL + CELL / 2;
      const p  = 0.6 + 0.4 * Math.sin(phase * 2.3 + g.gx * 1.4 + g.gy * 0.9);
      const r  = CELL * 0.22;
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur  = 10 * p;
      ctx.fillStyle   = `rgba(255,215,0,${0.8 * p + 0.2})`;
      ctx.beginPath();
      ctx.moveTo(cx,     cy - r);
      ctx.lineTo(cx + r, cy);
      ctx.lineTo(cx,     cy + r);
      ctx.lineTo(cx - r, cy);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = `rgba(255,255,100,${0.5 * p})`;
      ctx.lineWidth   = 1;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlayer() {
    const cx = px * CELL + CELL / 2;
    const cy = py * CELL + CELL / 2;
    const p  = 0.8 + 0.2 * Math.sin(phase * 5);
    ctx.save();
    ctx.shadowColor = '#0f8';
    ctx.shadowBlur  = 16 * p;
    ctx.fillStyle   = '#0f8';
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * 0.29, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = `rgba(180,255,230,${0.6 + 0.4 * p})`;
    ctx.lineWidth   = 1.5;
    ctx.stroke();
    // direction indicator dot
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.arc(cx - CELL * 0.08, cy - CELL * 0.08, CELL * 0.06, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawMinimap() {
    const s  = Math.max(2, Math.min(5, Math.floor(Math.min(80 / COLS, 60 / ROWS))));
    const mw = COLS * s;
    const mh = ROWS * s;
    const ox = canvas.width  - mw - 8;
    const oy = 8;
    ctx.save();
    // background
    ctx.fillStyle = 'rgba(0,5,22,0.75)';
    ctx.fillRect(ox - 2, oy - 2, mw + 4, mh + 4);
    // walls — batched
    ctx.strokeStyle = 'rgba(0,200,200,0.42)';
    ctx.lineWidth   = 0.5;
    ctx.beginPath();
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = grid[r][c];
        const x = ox + c * s, y = oy + r * s;
        if (r === 0 && cell.n) { ctx.moveTo(x, y);     ctx.lineTo(x + s, y); }
        if (c === 0 && cell.w) { ctx.moveTo(x, y);     ctx.lineTo(x, y + s); }
        if (cell.s)            { ctx.moveTo(x, y + s); ctx.lineTo(x + s, y + s); }
        if (cell.e)            { ctx.moveTo(x + s, y); ctx.lineTo(x + s, y + s); }
      }
    }
    ctx.stroke();
    // exit
    ctx.fillStyle = 'rgba(200,0,255,0.9)';
    ctx.fillRect(ox + ex * s + 1, oy + ey * s + 1, s - 1, s - 1);
    // gems
    ctx.fillStyle = 'rgba(255,215,0,0.8)';
    for (const g of gems) {
      if (!g.done) ctx.fillRect(ox + g.gx * s + 1, oy + g.gy * s + 1, s - 1, s - 1);
    }
    // player
    ctx.fillStyle = '#0f8';
    ctx.fillRect(ox + px * s, oy + py * s, s + 1, s + 1);
    ctx.restore();
  }

  function drawStartGlow() {
    // Subtle glow on start cell
    ctx.save();
    const p = 0.3 + 0.2 * Math.sin(phase * 1.2);
    ctx.fillStyle = `rgba(0,255,136,${p * 0.15})`;
    ctx.fillRect(0, 0, CELL, CELL);
    ctx.restore();
  }

  // ── Main draw ─────────────────────────────────────────────────────────────
  function draw() {
    phase += 0.04;
    ctx.fillStyle = '#060618';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (gState !== 'title') {
      drawMaze();
      drawStartGlow();
      drawExit();
      drawGems();
      drawPlayer();
      drawMinimap();
    }
  }

  // ── Animation loop ────────────────────────────────────────────────────────
  function loop() {
    draw();
    requestAnimationFrame(loop);
  }

  // ── Keyboard input ────────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (['ArrowUp',    'w', 'W'].includes(k)) { e.preventDefault(); move(0, -1); }
    if (['ArrowDown',  's', 'S'].includes(k)) { e.preventDefault(); move(0,  1); }
    if (['ArrowLeft',  'a', 'A'].includes(k)) { e.preventDefault(); move(-1, 0); }
    if (['ArrowRight', 'd', 'D'].includes(k)) { e.preventDefault(); move( 1, 0); }
    if (k === 'r' || k === 'R') {
      if (gState === 'gameover')   { level = 1; score = 0; startLevel(); }
      if (gState === 'levelclear') { level++;               startLevel(); }
    }
  });

  // ── D-pad (touchstart + mousedown both work) ──────────────────────────────
  document.querySelectorAll('.dpb').forEach(btn => {
    const dx = +btn.dataset.dx;
    const dy = +btn.dataset.dy;
    btn.addEventListener('touchstart', e => { e.preventDefault(); move(dx, dy); }, { passive: false });
    btn.addEventListener('mousedown',  ()  => move(dx, dy));
  });

  // ── Swipe on canvas ───────────────────────────────────────────────────────
  let swipeOrigin = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    swipeOrigin = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!swipeOrigin) return;
    const t  = e.changedTouches[0];
    const dx = t.clientX - swipeOrigin.x;
    const dy = t.clientY - swipeOrigin.y;
    swipeOrigin = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 16) return; // too short — ignore
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1, 0);
    else                             move(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  // ── Overlay button ────────────────────────────────────────────────────────
  ovBtn.addEventListener('click', () => {
    if (gState === 'title' || gState === 'gameover') { level = 1; score = 0; startLevel(); }
    else if (gState === 'levelclear')                { level++;               startLevel(); }
  });

  // ── Show d-pad on touch devices ───────────────────────────────────────────
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    dpad.style.display = 'block';
  }

  // ── Resize handling ───────────────────────────────────────────────────────
  window.addEventListener('resize', () => {
    if (gState === 'playing') computeLayout();
  });

  // ── Boot ──────────────────────────────────────────────────────────────────
  // Sets canvas size for the title screen; overlay shows on top.
  computeLayout();
  overlay.style.display = 'flex';
  requestAnimationFrame(loop);
  </script>
</body>
</html>
