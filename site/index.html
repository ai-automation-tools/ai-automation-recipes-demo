<!DOCTYPE html>
<!-- AI Automation Recipes viewer. Copied into an output folder by scripts/build_viewer.py, which writes
     catalog.js beside it. Works from file:// and any static host. House style: web-house-style app shell
     with a content sidebar (drawer on phones). Look borrowed from the AI Automation Library catalog:
     dot grid with a soft glow, sky-to-violet gradient, glass cards with a cursor spotlight, and one
     accent hue per collection. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI Recipes Viewer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2338bdf8'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0e'/%3E%3Crect x='1' y='1' width='30' height='30' rx='6' fill='none' stroke='url(%23g)' stroke-width='2'/%3E%3Cg transform='translate(6 6) scale(0.8333)' fill='none' stroke='url(%23g)' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='7' height='7' rx='1.5'/%3E%3Crect x='14' y='3' width='7' height='7' rx='1.5'/%3E%3Crect x='3' y='14' width='7' height='7' rx='1.5'/%3E%3Cpath d='M17.5 13.5v7M14 17h7'/%3E%3C/g%3E%3C/svg%3E" />
  <meta name="theme-color" content="#060606" />
  <script>
    // Pre-paint: theme and drawer state, so neither flashes. Default must equal THEME_DEFAULT below.
    (function () {
      var d = document.documentElement, t = 'dark';
      try {
        var s = localStorage.getItem('ai-automation-recipes.theme'); if (s === 'light' || s === 'dark') t = s;
        if (localStorage.getItem('ai-automation-recipes.rail') === 'shut') d.classList.add('rail-collapsed');
      } catch (e) {}
      d.classList.add(t);
      if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fafafa');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #060606; --dot: rgba(255,255,255,.035);
      --surface: linear-gradient(180deg, rgba(28,28,31,.62), rgba(14,14,16,.68)); --surface-flat: rgba(24,24,27,.45);
      --glass-line: rgba(255,255,255,.08); --glass-line-2: rgba(255,255,255,.16); --glass-hi: rgba(255,255,255,.06);
      --bar: rgba(6,6,6,.72); --bar-line: rgba(39,39,42,.6); --rail-bg: rgba(8,8,10,.92); --srcbar-bg: #0a0a0b;
      --switch-bg: rgba(39,39,42,.6); --pop-shadow: rgba(0,0,0,.7); --thumb: #27272a;
      --line: rgba(39,39,42,.6); --line-2: #3f3f46;
      --fg: #f4f4f5; --fg-2: #d4d4d8; --fg-3: #a1a1aa; --fg-4: #71717a; --fg-5: #52525b;
      --scrim: rgba(0,0,0,.55); --media-bg: #0b0b0e; --code-bg: rgba(39,39,42,.55);
      --accent: #38bdf8; --accent-2: #a855f7; --accent-ink: #0b1220;
      --grad: linear-gradient(120deg, var(--accent), var(--accent-2));
      --cat-l: 74%; --cat-c: .17;
      --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
      --r-xl: 18px; --r-lg: 12px; --r-md: 8px;
      --ease: cubic-bezier(.2,.7,.2,1);
      --srcbar-h: 34px; --topbar-h: 56px;
      --rail-open: 264px; --rail-shut: 0px; --rail-w: var(--rail-open);
      --gutter: clamp(16px, 2.2vw, 32px);
      --glow: var(--accent);
    }
    html.rail-collapsed { --rail-w: var(--rail-shut); }
    html.light {
      color-scheme: light;
      --bg: #fafafa; --dot: rgba(9,9,11,.06);
      --surface: linear-gradient(180deg, rgba(255,255,255,.9), rgba(250,250,250,.85)); --surface-flat: #fff;
      --glass-line: #e4e4e7; --glass-line-2: #d4d4d8; --glass-hi: rgba(255,255,255,.8);
      --bar: rgba(250,250,250,.8); --bar-line: #e4e4e7; --rail-bg: rgba(244,244,245,.95); --srcbar-bg: #f4f4f5;
      --switch-bg: rgba(228,228,231,.6); --pop-shadow: rgba(0,0,0,.18); --thumb: #d4d4d8;
      --line: #e4e4e7; --line-2: #d4d4d8;
      --fg: #09090b; --fg-2: #27272a; --fg-3: #52525b; --fg-4: #63636b; --fg-5: #76767f;
      --scrim: rgba(9,9,11,.35); --media-bg: #e4e4e7; --code-bg: #f4f4f5;
      --accent: #0284c7; --accent-2: #7c3aed; --accent-ink: #fff;
      --cat-l: 52%; --cat-c: .17;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
    body {
      margin: 0; padding-top: var(--srcbar-h); color: var(--fg); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased;
      /* Ground and atmosphere, as in the Library: a glow pinned to the top in the page's accent, a violet
         counter-glow, and the 24px dot grid. */
      background-color: var(--bg);
      background-image:
        radial-gradient(900px 420px at 72% -80px, color-mix(in oklch, var(--glow) 16%, transparent), transparent 70%),
        radial-gradient(520px 300px at 12% 120px, color-mix(in oklch, var(--accent-2) 8%, transparent), transparent 70%),
        radial-gradient(var(--dot) 1.2px, transparent 0);
      background-size: auto, auto, 24px 24px; background-repeat: no-repeat, no-repeat, repeat;
      background-attachment: scroll, scroll, fixed; min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--thumb); border-radius: 4px; border: 2px solid var(--bg); }
    ::selection { background: var(--accent); color: var(--accent-ink); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    .skip { position: absolute; left: -9999px; top: 40px; z-index: 80; padding: 6px 12px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .skip:focus { left: 16px; }
    .grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .scroll-progress { position: fixed; top: 0; left: 0; height: 2px; width: 100%; z-index: 90; pointer-events: none; transform-origin: 0 0; transform: scaleX(var(--p, 0)); background: var(--grad); }

    /* Source bar */
    .src-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 70; height: var(--srcbar-h); display: flex; align-items: center; gap: 16px; padding: 0 var(--gutter); background: var(--srcbar-bg); border-bottom: 1px solid var(--bar-line); font-size: 12px; }
    .src-note { margin: 0; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--fg-4); }
    .src-note strong { font-weight: 600; color: var(--accent); }
    .src-link { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 6px; color: var(--fg-3); font-weight: 500; transition: color .15s; }
    .src-link:hover { color: var(--fg); }

    /* Sidebar: every collection. Collapses away on desktop; a drawer over a scrim on phones. */
    .side { position: fixed; top: var(--srcbar-h); left: 0; bottom: 0; width: var(--rail-open); z-index: 41; display: flex; flex-direction: column; background: var(--rail-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-right: 1px solid var(--bar-line); transform: translateX(0); transition: transform .18s var(--ease), visibility .18s; }
    html.rail-collapsed .side { transform: translateX(-100%); visibility: hidden; }
    .side-brand { flex: none; display: flex; align-items: center; gap: 10px; height: var(--topbar-h); padding: 0 14px; border-bottom: 1px solid var(--bar-line); }
    .brand-tile { width: 30px; height: 30px; flex: none; border-radius: 9px; display: grid; place-items: center; background: var(--grad); color: #060606; box-shadow: 0 0 18px -6px color-mix(in oklch, var(--accent) 70%, transparent); }
    .brand-tile svg { width: 18px; height: 18px; }
    .brand-name { font-weight: 600; letter-spacing: -.01em; line-height: 1.15; }
    .brand-sub { font: 500 10.5px var(--mono); color: var(--fg-4); }
    .side-list { flex: 1; overflow-y: auto; padding: 10px 8px 16px; }
    .glabel { padding: 14px 11px 6px; font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .14em; color: var(--fg-5); }
    .col-btn { --c: var(--accent); position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 11px; border: 0; border-radius: 9px; background: transparent; color: var(--fg-2); font-size: 13px; font-weight: 500; text-align: left; cursor: pointer; transition: background .15s, color .15s; }
    .col-btn .dot { width: 7px; height: 7px; border-radius: 99px; flex: none; background: var(--c); box-shadow: 0 0 8px -1px var(--c); }
    .col-btn:hover { background: color-mix(in oklch, var(--c) 10%, transparent); color: var(--fg); }
    .col-btn[aria-current="true"] { background: color-mix(in oklch, var(--c) 16%, transparent); color: var(--fg); }
    .col-btn[aria-current="true"]::before { content: ""; position: absolute; left: -8px; top: 50%; transform: translateY(-50%); width: 3px; height: 18px; border-radius: 0 3px 3px 0; background: var(--c); }
    .col-name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .count { flex: none; font: 500 11px var(--mono); color: var(--fg-4); }
    .scrim { display: none; }

    /* Top bar */
    .topbar { position: sticky; top: var(--srcbar-h); z-index: 40; margin-left: var(--rail-w); height: var(--topbar-h); display: flex; align-items: center; gap: 12px; padding: 0 var(--gutter); background: var(--bar); backdrop-filter: blur(14px) saturate(150%); -webkit-backdrop-filter: blur(14px) saturate(150%); border-bottom: 1px solid var(--bar-line); transition: margin-left .18s var(--ease); }
    .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; flex: none; padding: 0; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); color: var(--fg-3); cursor: pointer; transition: color .15s, border-color .15s; }
    .icon-btn:hover { color: var(--fg); border-color: var(--line-2); }
    .icon-btn svg { width: 17px; height: 17px; }
    .crumb { min-width: 0; color: var(--fg-4); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crumb a:hover { color: var(--fg); }
    .crumb strong { color: var(--fg); font-weight: 500; }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--fg-4); pointer-events: none; }
    .search { width: 260px; height: 34px; padding: 0 34px 0 30px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-flat); color: var(--fg); font: 13px var(--sans); transition: border-color .15s, box-shadow .15s; }
    .search:focus { outline: none; border-color: color-mix(in oklch, var(--accent) 50%, transparent); box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 15%, transparent); }
    .search::placeholder { color: var(--fg-4); }
    .search-wrap kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 10.5px var(--mono); padding: 2px 5px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; color: var(--fg-4); }
    .tb-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); color: var(--fg-2); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: color .15s, border-color .15s; }
    .tb-btn:hover { color: var(--fg); border-color: var(--line-2); }
    .tb-btn svg { width: 14px; height: 14px; }
    .theme-sw { display: inline-flex; align-items: center; gap: 2px; padding: 2px; border-radius: 12px; background: var(--switch-bg); flex: none; }
    .theme-sw button { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 26px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: var(--fg-4); cursor: pointer; transition: color .15s, background-color .15s; }
    .theme-sw button:hover { color: var(--fg); }
    .theme-sw button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
    .theme-sw svg { width: 13px; height: 13px; }

    /* Main */
    main { margin-left: var(--rail-w); padding: 28px var(--gutter) 40px; transition: margin-left .18s var(--ease); }
    .shell { max-width: min(100%, 1280px); margin-inline: auto; }
    .eyebrow { font: 500 11.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--fg-4); }
    .eyebrow b { color: var(--accent); font-weight: 500; }
    h1 { margin: 8px 0 0; font-size: 30px; letter-spacing: -.03em; font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
    .sub { margin: 8px 0 0; color: var(--fg-3); max-width: 70ch; }
    section + section { margin-top: 44px; }
    .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .sec-head h2 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.02em; }
    .sec-head .more { font: 500 12px var(--mono); color: var(--fg-4); }
    .sec-head .more:hover { color: var(--accent); }

    /* Home hero */
    .hero { display: grid; gap: 28px; padding: 26px 0 8px; }
    .hero h1 { font-size: clamp(34px, 5.4vw, 60px); letter-spacing: -.035em; line-height: 1.04; width: fit-content; }
    .hero .lede { margin: 14px 0 0; max-width: 60ch; color: var(--fg-3); font-size: 15.5px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-self: end; }
    @media (min-width: 640px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .stat { display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface-flat); }
    .stat b { font-size: 24px; line-height: 1.1; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .stat span { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-4); }
    @media (min-width: 1100px) { .hero { grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); align-items: end; } }

    /* Glass cards with a cursor-tracked ring in the card's accent. */
    .glass { --c: var(--accent); --mx: 50%; --my: 50%; position: relative; border: 1px solid var(--glass-line); border-radius: var(--r-xl); background: var(--surface); box-shadow: inset 0 1px 0 0 var(--glass-hi), 0 10px 30px -14px var(--pop-shadow); transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
    .glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; opacity: 0; z-index: 3; background: radial-gradient(240px circle at var(--mx) var(--my), color-mix(in oklch, var(--c) 75%, transparent), transparent 70%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; transition: opacity .25s ease; }
    a.glass:hover, button.glass:hover { transform: translateY(-3px); border-color: var(--glass-line-2); box-shadow: inset 0 1px 0 0 var(--glass-hi), 0 20px 44px -16px var(--pop-shadow); }
    .glass:hover::before { opacity: 1; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 16px; }
    .card { display: flex; flex-direction: column; overflow: hidden; }
    .thumb { position: relative; aspect-ratio: 16 / 10; background: var(--media-bg); overflow: hidden; display: grid; place-items: center; border-bottom: 1px solid var(--glass-line); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s var(--ease); }
    .card:hover .thumb img { transform: scale(1.04); }
    .thumb .ph { font: 600 34px var(--mono); color: color-mix(in oklch, var(--c) 70%, var(--fg-5)); }
    .thumb.noimg { background: radial-gradient(120% 90% at 20% 0%, color-mix(in oklch, var(--c) 22%, transparent), transparent 60%), var(--media-bg); }
    .badges { position: absolute; left: 10px; top: 10px; display: flex; gap: 5px; }
    .badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 99px; background: rgba(6,6,6,.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: #f4f4f5; font: 500 10.5px var(--mono); }
    .badge svg { width: 11px; height: 11px; }
    .card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .card h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; color: var(--fg-2); overflow-wrap: anywhere; transition: color .15s; }
    .card:hover h3 { color: var(--fg); }
    .card p { margin: 0; color: var(--fg-3); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: auto; padding-top: 6px; font: 500 11px var(--mono); color: var(--fg-4); }
    .chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font: 500 11px var(--mono); color: var(--c); background: color-mix(in oklch, var(--c) 12%, transparent); border: 1px solid color-mix(in oklch, var(--c) 30%, transparent); }
    .tag { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--fg-3); font: 500 11px var(--mono); }

    /* Collection tiles on the home page */
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); gap: 12px; }
    .tile { display: flex; align-items: center; gap: 12px; padding: 10px; overflow: hidden; text-align: left; cursor: pointer; color: inherit; }
    .tile .tthumb { width: 56px; height: 56px; flex: none; border-radius: 12px; overflow: hidden; background: radial-gradient(120% 90% at 20% 0%, color-mix(in oklch, var(--c) 35%, transparent), transparent 70%), var(--media-bg); outline: 1px solid color-mix(in oklch, var(--c) 30%, transparent); outline-offset: -1px; display: grid; place-items: center; font: 600 18px var(--mono); color: var(--c); }
    .tile .tthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile b { display: block; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
    .tile small { display: block; font: 500 11px var(--mono); color: var(--fg-4); }

    .empty { margin-top: 24px; padding: 28px; border: 1px dashed var(--line-2); border-radius: var(--r-lg); color: var(--fg-3); text-align: center; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: var(--r-md); font-size: 13.5px; font-weight: 600; cursor: pointer; border: 1px solid transparent; white-space: nowrap; transition: transform .2s var(--ease), background .2s, border-color .2s, box-shadow .2s, color .2s; }
    .btn:active { transform: translateY(1px); }
    .btn svg { width: 15px; height: 15px; flex: none; }
    .btn-primary { background: var(--accent); color: var(--accent-ink); }
    .btn-primary:hover { box-shadow: 0 0 24px -6px color-mix(in oklch, var(--accent) 70%, transparent); }
    .btn-ghost { border-color: var(--line-2); color: var(--fg-2); background: var(--surface-flat); }
    .btn-ghost:hover { color: var(--fg); border-color: var(--fg-5); }

    /* Detail */
    .back { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); color: var(--fg-3); cursor: pointer; font-size: 13px; }
    .back:hover { color: var(--fg); border-color: var(--line-2); }
    .detail { display: grid; gap: 24px; margin-top: 18px; }
    @media (min-width: 1100px) { .detail { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; } .panel { position: sticky; top: calc(var(--srcbar-h) + var(--topbar-h) + 20px); } }
    .detail-head h1 { font-size: clamp(26px, 3.4vw, 38px); }
    .detail-head .summary { margin: 12px 0 0; max-width: 72ch; color: var(--fg-2); font-size: 15.5px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .media { margin-top: 22px; display: grid; gap: 14px; }
    .hero-img { display: block; width: 100%; max-height: 72vh; object-fit: contain; border-radius: var(--r-lg); background: var(--media-bg); outline: 1px solid var(--line); outline-offset: -1px; cursor: zoom-in; }
    .frame { width: 100%; height: min(78vh, 760px); height: min(78dvh, 760px); border: 1px solid var(--line-2); border-radius: var(--r-lg); background: var(--media-bg); }
    .player { padding: 14px 16px; display: grid; gap: 8px; }
    .player .lbl { font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-4); }
    audio { width: 100%; }
    video { width: min(100%, 420px); border-radius: var(--r-lg); background: var(--media-bg); }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(160px, 100%), 1fr)); gap: 10px; }
    .gallery button { display: block; padding: 0; border: 0; border-radius: var(--r-md); overflow: hidden; background: var(--media-bg); outline: 1px solid var(--line); outline-offset: -1px; aspect-ratio: 1; cursor: zoom-in; }
    .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s var(--ease); }
    .gallery button:hover img { transform: scale(1.05); }
    .doc { margin-top: 18px; padding: 24px 28px; max-width: 860px; color: var(--fg-2); line-height: 1.7; overflow-wrap: anywhere; }
    .doc .doc-label { margin-bottom: 8px; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--c); }
    .doc h1, .doc h2, .doc h3, .doc h4 { color: var(--fg); letter-spacing: -.015em; line-height: 1.3; margin: 1.5em 0 .6em; }
    .doc > :nth-child(2) { margin-top: 0; }
    .doc h1 { font-size: 24px; } .doc h2 { font-size: 19px; } .doc h3 { font-size: 16px; }
    .doc a { color: var(--accent); border-bottom: 1px solid color-mix(in oklch, var(--accent) 40%, transparent); }
    .doc code { font: 12.5px var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
    .doc pre { overflow-x: auto; background: var(--code-bg); padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line); }
    .doc pre code { background: none; padding: 0; }
    .doc blockquote { margin: 1em 0; padding: 2px 16px; border-left: 3px solid var(--c); color: var(--fg-3); font-style: italic; }
    .doc table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; }
    .doc th, .doc td { border-bottom: 1px solid var(--line-2); padding: 7px 12px; text-align: left; font-size: 13.5px; }
    .doc th { color: var(--fg); }
    .doc img { max-width: 100%; border-radius: var(--r-md); }
    .doc hr { border: 0; border-top: 1px solid var(--line-2); margin: 2em 0; }
    .panel { padding: 18px; display: grid; gap: 16px; }
    .panel h4 { margin: 0 0 8px; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-4); }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; font-size: 13px; }
    .kv dt { color: var(--fg-4); text-transform: capitalize; }
    .kv dd { margin: 0; color: var(--fg-2); overflow-wrap: anywhere; }
    .files { display: flex; flex-wrap: wrap; gap: 6px; }
    .files a { font: 500 11.5px var(--mono); color: var(--fg-3); border: 1px solid var(--line-2); border-radius: 999px; padding: 3px 9px; overflow-wrap: anywhere; }
    .files a:hover { color: var(--fg); border-color: var(--c); }
    .pn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 28px; max-width: 860px; }
    .pn a { padding: 12px 14px; display: grid; gap: 2px; }
    .pn a span { font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-4); }
    .pn a b { font-weight: 600; font-size: 13.5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .pn .next { text-align: right; }

    /* Lightbox */
    .lightbox { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgb(0 0 0 / .92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .lightbox[hidden] { display: none; }
    .lightbox img { max-width: 94vw; max-height: 90vh; object-fit: contain; border-radius: 8px; }
    .lb-btn { position: absolute; width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; line-height: 1; color: #fff; background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .16); border-radius: 999px; cursor: pointer; }
    .lb-btn:hover { background: rgb(255 255 255 / .16); }
    .lb-close { top: 16px; right: 18px; } .lb-prev { left: 18px; top: 50%; } .lb-next { right: 18px; top: 50%; }
    .lb-count { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); font: 500 12px var(--mono); color: #a1a1aa; }

    footer { margin-left: var(--rail-w); padding: 24px var(--gutter) 32px; border-top: 1px solid var(--bar-line); color: var(--fg-4); font-size: 12.5px; transition: margin-left .18s var(--ease); }
    footer .shell { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
    footer a { color: var(--fg-3); } footer a:hover { color: var(--accent); }
    .to-top { position: fixed; right: 20px; bottom: 20px; z-index: 35; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; border: 1px solid var(--line-2); background: var(--rail-bg); color: var(--fg-3); cursor: pointer; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s, transform .2s, color .15s; }
    .to-top.on { opacity: 1; transform: none; pointer-events: auto; }
    .to-top:hover { color: var(--fg); }

    /* Phone: the sidebar becomes a drawer over a scrim. */
    @media (max-width: 900px) { .crumb { display: none; } .search { width: 190px; } .tb-btn span { display: none; } }
    @media (max-width: 720px) {
      :root { --rail-w: 0px; }
      html.rail-collapsed { --rail-w: 0px; }
      .side, html.rail-collapsed .side { width: min(var(--rail-open), 84%); transform: translateX(-100%); visibility: hidden; z-index: 60; box-shadow: 0 0 40px -8px var(--pop-shadow); }
      html.drawer-open .side { transform: translateX(0); visibility: visible; }
      html.drawer-open .scrim { display: block; position: fixed; inset: var(--srcbar-h) 0 0 0; z-index: 55; background: var(--scrim); }
    }
    @media (max-width: 600px) {
      input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]), select, textarea { font-size: 16px; }
      .search-wrap { flex: 1; min-width: 0; } .search { height: 40px; width: 100%; } .search-wrap kbd { display: none; }
      .topbar-right { flex: 1; min-width: 0; }
      .theme-sw button { width: 36px; height: 32px; }
      .icon-btn, .tb-btn { width: 40px; height: 40px; justify-content: center; padding: 0; }
      .col-btn { height: 40px; }
      .btn, .back { height: 40px; }
      .doc { padding: 18px; }
      .pn { grid-template-columns: 1fr; } .pn .next { text-align: left; }
      .lb-prev, .lb-next { top: auto; bottom: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
<div class="scroll-progress" id="progress" aria-hidden="true"></div>
<a class="skip" href="#main">Skip to content</a>

<div class="src-bar">
  <p class="src-note"><strong>AI Automation Recipes</strong> &middot; everything your scheduled recipes have made, in one place.</p>
  <a class="src-link" href="https://github.com/ai-automation-tools/ai-automation-recipes" target="_blank" rel="noopener">
    <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    View source
  </a>
</div>

<aside class="side" id="side" aria-label="Collections">
  <a class="side-brand" href="#/">
    <span class="brand-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17.5 13.5v7M14 17h7"/></svg></span>
    <span><span class="brand-name" id="brandName">Recipes Viewer</span><br><span class="brand-sub" id="brandSub"></span></span>
  </a>
  <div class="side-list" id="sideList"></div>
</aside>
<div class="scrim" id="scrim"></div>

<header class="topbar">
  <button class="icon-btn" id="railToggle" type="button" aria-label="Hide collections" aria-expanded="true" aria-controls="side">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
  </button>
  <div class="crumb" id="crumb"></div>
  <div class="topbar-right">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="search" id="search" type="search" placeholder="Search everything" aria-label="Search" />
      <kbd>/</kbd>
    </div>
    <button class="tb-btn" id="random" type="button" title="Open a random item" aria-label="Open a random item">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h3c4 0 4 8 8 8h3"/><path d="M14 11l3 3-3 3M14 3l3 3-3 3"/><path d="M3 14h3c1.6 0 2.6-1.3 3.5-2.9"/></svg>
      <span>Random</span>
    </button>
    <div class="theme-sw" id="themeSw" role="group" aria-label="Theme">
      <button type="button" data-theme="light" aria-pressed="false" aria-label="Light theme" title="Light theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></button>
      <button type="button" data-theme="dark" aria-pressed="true" aria-label="Dark theme" title="Dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg></button>
    </div>
  </div>
</header>

<main id="main"><div class="shell" id="view"></div></main>
<footer><div class="shell" id="foot"></div></footer>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
  <img id="lbImg" alt="" />
  <button class="lb-btn lb-close" id="lbClose" type="button" aria-label="Close">&times;</button>
  <button class="lb-btn lb-prev" id="lbPrev" type="button" aria-label="Previous image">&lsaquo;</button>
  <button class="lb-btn lb-next" id="lbNext" type="button" aria-label="Next image">&rsaquo;</button>
  <div class="lb-count" id="lbCount"></div>
</div>
<button class="to-top" id="toTop" type="button" aria-label="Back to top"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 15V5M5 10l5-5 5 5"/></svg></button>

<script src="catalog.js"></script>
<script>
  const d = document.documentElement;
  const CATALOG = window.CATALOG || { title: 'AI Recipes', generated: '', groups: [], items: [] };
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // Asset paths in the catalog are relative to this page; encode each segment, keep the slashes.
  const url = p => p.split('/').map(encodeURIComponent).join('/');
  const ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
    audio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
    video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4z"/></svg>',
    images: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>',
    ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
  };

  // Theme switch. THEME_DEFAULT must equal the pre-paint default in <head>.
  const THEME_KEY = 'ai-automation-recipes.theme', THEME_DEFAULT = 'dark';
  const themeBtns = document.querySelectorAll('#themeSw button');
  function setTheme(t) {
    d.classList.remove('light', 'dark'); d.classList.add(t);
    themeBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === t)));
    document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#fafafa' : '#060606');
  }
  setTheme(d.classList.contains('light') ? 'light' : THEME_DEFAULT);
  themeBtns.forEach(b => b.addEventListener('click', () => { setTheme(b.dataset.theme); try { localStorage.setItem(THEME_KEY, b.dataset.theme); } catch (e) {} }));

  // Sidebar: collapses on desktop (persisted), opens as a drawer on phones.
  const railToggle = $('#railToggle'), phone = () => matchMedia('(max-width: 720px)').matches;
  function syncRail() {
    const open = phone() ? d.classList.contains('drawer-open') : !d.classList.contains('rail-collapsed');
    railToggle.setAttribute('aria-expanded', String(open));
    railToggle.setAttribute('aria-label', open ? 'Hide collections' : 'Show collections');
  }
  railToggle.addEventListener('click', () => {
    if (phone()) d.classList.toggle('drawer-open');
    else { const shut = d.classList.toggle('rail-collapsed'); try { localStorage.setItem('ai-automation-recipes.rail', shut ? 'shut' : 'open'); } catch (e) {} }
    syncRail();
  });
  $('#scrim').addEventListener('click', () => { d.classList.remove('drawer-open'); syncRail(); });
  addEventListener('resize', syncRail); syncRail();

  // One accent hue per collection, stable across builds: hashed from its id.
  const hue = id => { let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
  const accent = id => `oklch(var(--cat-l) var(--cat-c) ${hue(id)})`;
  const cvar = id => `--c:${accent(id)}`;

  const byCollection = {};
  CATALOG.items.forEach(it => (byCollection[it.collection] ||= []).push(it));
  const groups = CATALOG.groups.map(g => ({ ...g, collections: g.collections.filter(c => byCollection[c.id]) })).filter(g => g.collections.length);
  const labelOf = col => (CATALOG.groups.flatMap(g => g.collections).find(c => c.id === col) || { label: col }).label;
  const nCols = Object.keys(byCollection).length;

  $('#brandName').textContent = CATALOG.title;
  $('#brandSub').textContent = `${CATALOG.items.length} items · ${nCols} collections`;
  $('#foot').innerHTML = `<span>${esc(CATALOG.title)}${CATALOG.generated ? ' · built ' + esc(CATALOG.generated) : ''}</span>
    <span>Made by <a href="https://github.com/ai-automation-tools/ai-automation-recipes" target="_blank" rel="noopener">AI Automation Recipes</a> · <a href="https://ai-automation-tools.dev" target="_blank" rel="noopener">ai-automation-tools.dev</a></span>`;

  function sidebar(active) {
    const btn = (key, label, n) => `<button class="col-btn" type="button" style="${key ? cvar(key) : ''}" data-col="${esc(key)}" aria-current="${active === key}"><span class="dot"></span><span class="col-name">${esc(label)}</span><span class="count">${n}</span></button>`;
    let html = btn('', 'Everything', CATALOG.items.length);
    groups.forEach(g => { html += `<div class="glabel">${esc(g.name)}</div>` + g.collections.map(c => btn(c.id, c.label, byCollection[c.id].length)).join(''); });
    $('#sideList').innerHTML = html;
    $('#sideList').querySelectorAll('.col-btn').forEach(b => b.addEventListener('click', () => {
      $('#search').value = '';
      location.hash = b.dataset.col ? '#/c/' + encodeURIComponent(b.dataset.col) : '#/';
      d.classList.remove('drawer-open'); syncRail();
    }));
  }

  function badges(it) {
    const b = [];
    if (it.html) b.push(`<span class="badge">${ICON.play}Interactive</span>`);
    if (it.audio.length) b.push(`<span class="badge">${ICON.audio}Audio</span>`);
    if (it.video.length) b.push(`<span class="badge">${ICON.video}Video</span>`);
    if (it.gallery.length > 1) b.push(`<span class="badge">${ICON.images}${it.gallery.length}</span>`);
    return b.length ? `<div class="badges">${b.join('')}</div>` : '';
  }

  function card(it) {
    const thumb = it.thumb ? `<img src="${url(it.thumb)}" alt="" loading="lazy">` : `<span class="ph">${esc((it.title || '?')[0])}</span>`;
    return `<a class="glass card" style="${cvar(it.collection)}" href="#/a/${encodeURIComponent(it.id)}">
      <div class="thumb${it.thumb ? '' : ' noimg'}">${thumb}${badges(it)}</div>
      <div class="card-body"><h3>${esc(it.title)}</h3><p>${esc(it.summary)}</p>
      <div class="meta"><span class="chip">${esc(labelOf(it.collection))}</span><span>${esc(it.date)}</span></div></div></a>`;
  }
  const grid = items => `<div class="grid">${items.map(card).join('')}</div>`;

  function setChrome(crumb, title, col) {
    $('#crumb').innerHTML = crumb;
    document.title = title === CATALOG.title ? title : `${title} · ${CATALOG.title}`;
    d.style.setProperty('--glow', col ? accent(col) : 'var(--accent)');
    sidebar(col || '');
  }
  const crumbRoot = `<a href="#/">${esc(CATALOG.title)}</a>`;

  function homeView() {
    setChrome(`${crumbRoot}`, CATALOG.title, '');
    if (!CATALOG.items.length) {
      $('#view').innerHTML = `<div class="hero"><div><p class="eyebrow">${esc(CATALOG.title)}</p><h1 class="grad-text">Nothing here yet</h1>
        <p class="lede">Run a recipe, then rebuild the viewer with <code>scripts/build_viewer.py</code>.</p></div></div>`;
      return;
    }
    // A taste of everything: the newest item from eight different collections, picked fresh each visit.
    const picks = Object.values(byCollection).map(list => list[0]).sort(() => Math.random() - .5).slice(0, 8);
    const media = CATALOG.items.filter(i => i.audio.length || i.video.length).length;
    const playable = CATALOG.items.filter(i => i.html).length;
    const sections = groups.map(g => `<section><div class="sec-head"><h2>${esc(g.name)}</h2><span class="more">${g.collections.reduce((n, c) => n + byCollection[c.id].length, 0)} items</span></div>
      <div class="tiles">${g.collections.map(c => {
        const items = byCollection[c.id], t = items.find(i => i.thumb);
        return `<a class="glass tile" style="${cvar(c.id)}" href="#/c/${encodeURIComponent(c.id)}"><span class="tthumb">${t ? `<img src="${url(t.thumb)}" alt="" loading="lazy">` : esc(c.label[0])}</span>
          <span><b>${esc(c.label)}</b><small>${items.length} item${items.length === 1 ? '' : 's'}</small></span></a>`;
      }).join('')}</div></section>`).join('');
    const repo = CATALOG.repo ? `<a class="btn btn-ghost" href="${esc(CATALOG.repo)}" target="_blank" rel="noopener">${ICON.ext}Get the recipes</a>` : '';
    $('#view').innerHTML = `<div class="hero"><div>
        <p class="eyebrow"><b>${CATALOG.items.length} items</b> · ${nCols} collections · ${groups.length} groups</p>
        <h1 class="grad-text">${esc(CATALOG.title)}</h1>
        <p class="lede">Stories, playable games, comics, songs, podcasts, maps and app prototypes, each one the folder a scheduled recipe published. Open any item to see exactly what came out.</p>
        <div class="hero-actions"><a class="btn btn-primary" href="#/c/${encodeURIComponent(groups[0].collections[0].id)}">Start browsing</a>
          <button class="btn btn-ghost" type="button" id="heroRandom">Surprise me</button>${repo}</div></div>
        <div class="stats"><div class="stat"><b>${CATALOG.items.length}</b><span>Items</span></div><div class="stat"><b>${nCols}</b><span>Collections</span></div>
          <div class="stat"><b>${playable}</b><span>Playable</span></div><div class="stat"><b>${media}</b><span>Audio &amp; video</span></div></div>
      </div>
      <section><div class="sec-head"><h2>A taste of everything</h2><a class="more" href="#/all">See all ${CATALOG.items.length} &rarr;</a></div>${grid(picks)}</section>
      ${sections}`;
    $('#heroRandom').addEventListener('click', randomItem);
  }

  function listView(col) {
    const name = col ? labelOf(col) : 'Everything';
    const items = col ? (byCollection[col] || []) : CATALOG.items;
    setChrome(`${crumbRoot} / <strong>${esc(name)}</strong>`, name, col);
    const group = col ? (groups.find(g => g.collections.some(c => c.id === col)) || {}).name : '';
    $('#view').innerHTML = `<p class="eyebrow">${col ? `<b style="color:${accent(col)}">${esc(group || 'Collection')}</b>` : '<b>All collections</b>'}</p><h1>${esc(name)}</h1>
      <p class="sub">${items.length} item${items.length === 1 ? '' : 's'}, newest first.</p>
      ${items.length ? `<section style="margin-top:24px">${grid(items)}</section>` : `<div class="empty">Nothing in this collection yet.</div>`}`;
  }

  function searchView(q) {
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    const hits = CATALOG.items.filter(it => { const hay = `${it.title} ${it.summary} ${labelOf(it.collection)}`.toLowerCase(); return terms.every(t => hay.includes(t)); });
    setChrome(`${crumbRoot} / <strong>Search</strong>`, `Search: ${q}`, '');
    $('#view').innerHTML = `<p class="eyebrow"><b>Search</b></p><h1>“${esc(q)}”</h1><p class="sub">${hits.length} match${hits.length === 1 ? '' : 'es'}.</p>
      ${hits.length ? `<section style="margin-top:24px">${grid(hits)}</section>` : `<div class="empty">Nothing matches. Try fewer words.</div>`}`;
  }

  // Lightbox over every image in the current item, with arrow keys.
  let lbList = [], lbAt = 0;
  function lbShow(i) { lbAt = (i + lbList.length) % lbList.length; $('#lbImg').src = url(lbList[lbAt]); $('#lbCount').textContent = lbList.length > 1 ? `${lbAt + 1} / ${lbList.length}` : ''; $('#lbPrev').hidden = $('#lbNext').hidden = lbList.length < 2; }
  function lbOpen(list, i) { lbList = list; $('#lightbox').hidden = false; lbShow(i); $('#lbClose').focus(); }
  function lbClose() { $('#lightbox').hidden = true; $('#lbImg').removeAttribute('src'); }
  $('#lbClose').addEventListener('click', lbClose);
  $('#lbPrev').addEventListener('click', () => lbShow(lbAt - 1));
  $('#lbNext').addEventListener('click', () => lbShow(lbAt + 1));
  $('#lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') lbClose(); });

  function detailView(id) {
    const it = CATALOG.items.find(x => x.id === id);
    if (!it) return homeView();
    const col = it.collection, siblings = byCollection[col], at = siblings.indexOf(it);
    setChrome(`${crumbRoot} / <a href="#/c/${encodeURIComponent(col)}">${esc(labelOf(col))}</a> / <strong>${esc(it.title)}</strong>`, it.title, col);
    const media = [];
    if (it.html) media.push(`<iframe class="frame" src="${url(it.html)}" sandbox="allow-scripts allow-popups allow-forms" title="${esc(it.title)}" loading="lazy"></iframe>`);
    // One image and no cover (a comic, a poster): show it large rather than as a one-item gallery.
    const solo = !it.html && !it.cover && it.gallery.length === 1 ? it.gallery[0] : null;
    const big = solo || (!it.html && it.cover && !it.gallery.length ? it.cover : null);
    const images = big ? [big] : (it.cover ? [it.cover] : []).concat(it.gallery);
    if (big) media.push(`<img class="hero-img" data-lb="0" src="${url(big)}" alt="${esc(it.title)}">`);
    else if (!it.html && it.cover) media.push(`<img class="hero-img" data-lb="0" src="${url(it.cover)}" alt="${esc(it.title)} cover">`);
    it.audio.forEach(a => media.push(`<div class="glass player"><span class="lbl">${esc(a.split('/').pop())}</span><audio controls preload="none" src="${url(a)}"></audio></div>`));
    it.video.forEach(v => media.push(`<video controls preload="none" src="${url(v)}"${it.cover ? ` poster="${url(it.cover)}"` : ''}></video>`));
    if (it.gallery.length && !solo) {
      const off = it.cover ? 1 : 0;
      media.push(`<div class="gallery">${it.gallery.map((g, i) => `<button type="button" data-lb="${i + off}" aria-label="Open image ${i + 1}"><img src="${url(g)}" alt="" loading="lazy"></button>`).join('')}</div>`);
    }
    const fields = Object.entries(it.fields || {}).filter(([, v]) => v !== null && typeof v !== 'object' && String(v).length < 60);
    const actions = [];
    if (it.html) actions.push(`<a class="btn btn-primary" href="${url(it.html)}" target="_blank" rel="noopener">${ICON.ext}Open full screen</a>`);
    (it.pages || []).forEach(p => actions.push(`<a class="btn btn-ghost" href="${url(p)}" target="_blank" rel="noopener">${esc(p.split('/').pop().replace(/\.html$/, '').replace(/[-_]/g, ' '))}</a>`));
    const links = [];
    if (CATALOG.repo && it.recipe) {
      links.push(`<a class="btn btn-ghost" href="${esc(CATALOG.repo)}/tree/main/recipes/${encodeURIComponent(it.recipe)}" target="_blank" rel="noopener">The recipe</a>`);
      if (it.template) links.push(`<a class="btn btn-ghost" href="${esc(CATALOG.repo)}/blob/main/registry/templates/recipe-${encodeURIComponent(it.recipe)}.json" target="_blank" rel="noopener">Cronsole template</a>`);
    } else links.push(`<a class="btn btn-ghost" href="${url(it.folder)}/" target="_blank" rel="noopener">Open folder</a>`);
    const nav = (x, cls, lbl) => x ? `<a class="glass ${cls}" style="${cvar(col)}" href="#/a/${encodeURIComponent(x.id)}"><span>${lbl}</span><b>${esc(x.title)}</b></a>` : '<span></span>';
    $('#view').innerHTML = `<button class="back" type="button" id="back">&larr; Back</button>
      <div class="detail" style="${cvar(col)}"><div>
        <div class="detail-head"><p class="eyebrow"><b style="color:${accent(col)}">${esc(labelOf(col))}</b> · ${esc(it.date)}</p><h1>${esc(it.title)}</h1>
        <p class="summary">${esc(it.summary)}</p><div class="actions">${actions.join('')}</div></div>
        <div class="media">${media.join('')}</div>
        ${it.docs.map(doc => `<article class="glass doc"><div class="doc-label">${esc(doc.name)}</div>${doc.html}</article>`).join('')}
        <nav class="pn" aria-label="More in this collection">${nav(siblings[at - 1], 'prev', '&larr; Newer')}${nav(siblings[at + 1], 'next', 'Older &rarr;')}</nav>
      </div>
      <aside class="glass panel" aria-label="About this item">
        <div><h4>Details</h4><dl class="kv"><dt>Collection</dt><dd>${esc(labelOf(col))}</dd><dt>Date</dt><dd>${esc(it.date)}</dd>${it.recipe ? `<dt>Recipe</dt><dd>${esc(it.recipe)}</dd>` : ''}
          ${fields.map(([k, v]) => `<dt>${esc(k.replace(/_/g, ' '))}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>
        <div><h4>Make your own</h4><div class="actions" style="margin-top:0">${links.join('')}</div></div>
        <div><h4>Files</h4><div class="files">${it.files.map(f => `<a href="${url(f)}" target="_blank" rel="noopener">${esc(f.slice(it.folder.length + 1))}</a>`).join('')}</div></div>
      </aside></div>`;
    $('#back').addEventListener('click', () => history.length > 1 ? history.back() : (location.hash = '#/'));
    $('#view').querySelectorAll('[data-lb]').forEach(el => el.addEventListener('click', () => lbOpen(images, +el.dataset.lb)));
    scrollTo(0, 0);
  }

  function randomItem() {
    const it = CATALOG.items[Math.floor(Math.random() * CATALOG.items.length)];
    if (it) location.hash = '#/a/' + encodeURIComponent(it.id);
  }
  $('#random').addEventListener('click', randomItem);

  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    const q = $('#search').value.trim();
    if (h.startsWith('/a/')) detailView(h.slice(3));
    else if (q) searchView(q);
    else if (h.startsWith('/c/')) listView(h.slice(3));
    else if (h === '/all') listView('');
    else homeView();
  }
  $('#search').addEventListener('input', () => { if (location.hash.startsWith('#/a/')) location.hash = '#/'; else route(); });

  // Keys: "/" focuses search, Escape closes the lightbox or clears search, arrows page the lightbox.
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (!$('#lightbox').hidden) {
      if (e.key === 'Escape') lbClose();
      else if (e.key === 'ArrowLeft') lbShow(lbAt - 1);
      else if (e.key === 'ArrowRight') lbShow(lbAt + 1);
      return;
    }
    if (e.key === '/' && !typing) { e.preventDefault(); $('#search').focus(); }
    else if (e.key === 'Escape' && e.target.id === 'search') { e.target.value = ''; route(); }
  });

  // Spotlight ring: write the pointer position into the hovered glass card.
  document.addEventListener('pointermove', e => {
    const el = e.target.closest && e.target.closest('.glass');
    if (!el) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty('--mx', `${e.clientX - r.left}px`);
    el.style.setProperty('--my', `${e.clientY - r.top}px`);
  }, { passive: true });

  // Reading progress and back-to-top from one passive scroll listener.
  let ticking = false;
  addEventListener('scroll', () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      const max = d.scrollHeight - innerHeight;
      $('#progress').style.setProperty('--p', String(max > 0 ? Math.min(1, scrollY / max) : 0));
      $('#toTop').classList.toggle('on', scrollY > 720);
      ticking = false;
    });
  }, { passive: true });
  $('#toTop').addEventListener('click', () => scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }));

  addEventListener('hashchange', route);
  route();
</script>
</body>
</html>
