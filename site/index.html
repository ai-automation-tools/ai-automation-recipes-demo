<!DOCTYPE html>
<!-- AI Automation Recipes viewer. Copied into an output folder by scripts/build_viewer.py, which writes
     catalog.js beside it. Works from file:// and any static host. House style: web-house-style app shell
     with a content sidebar (drawer on phones). Accent: indigo. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI Recipes Viewer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0e'/%3E%3Crect x='1' y='1' width='30' height='30' rx='6' fill='none' stroke='%23474d88' stroke-width='2'/%3E%3Cg transform='translate(6 6) scale(0.8333)' fill='none' stroke='%23818cf8' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='7' height='7' rx='1.5'/%3E%3Crect x='14' y='3' width='7' height='7' rx='1.5'/%3E%3Crect x='3' y='14' width='7' height='7' rx='1.5'/%3E%3Cpath d='M17.5 13.5v7M14 17h7'/%3E%3C/g%3E%3C/svg%3E" />
  <meta name="theme-color" content="#060606" />
  <script>
    // Pre-paint: theme and drawer state, so neither flashes. Default must equal THEME_DEFAULT below.
    (function () {
      var d = document.documentElement, t = 'dark';
      try {
        var s = localStorage.getItem('ai-automation-recipes.theme'); if (s === 'light' || s === 'dark') t = s;
        if (localStorage.getItem('ai-automation-recipes.rail') === 'shut') d.classList.add('rail-collapsed');
      } catch (e) {}
      d.classList.add(t);
      if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fafafa');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #060606;
      --surface: rgba(24,24,27,.45); --surface-2: rgba(24,24,27,.8); --field: rgba(24,24,27,.4);
      --bar: rgba(6,6,6,.82); --bar-line: #18181b; --rail-bg: #08080a; --srcbar-bg: #0a0a0b;
      --switch-bg: rgba(39,39,42,.6); --pop-bg: #17171b; --pop-shadow: rgba(0,0,0,.7); --thumb: #27272a;
      --line: rgba(63,63,70,.45); --line-2: rgba(63,63,70,.8); --rule: rgba(39,39,42,.6);
      --fg: #f4f4f5; --fg-2: #d4d4d8; --fg-3: #a1a1aa; --fg-4: #71717a; --fg-5: #52525b;
      --scrim: rgba(0,0,0,.55); --media-bg: #0b0b0e; --code-bg: rgba(39,39,42,.55);
      --accent: #818cf8; --accent-ink: #0b0b2a;
      --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
      --r-lg: 12px; --r-md: 8px;
      --ease: cubic-bezier(.2,.7,.2,1);
      --srcbar-h: 34px; --topbar-h: 52px;
      --rail-open: 260px; --rail-shut: 0px; --rail-w: var(--rail-open);
      --gutter: clamp(16px, 1.8vw, 28px);
    }
    html.rail-collapsed { --rail-w: var(--rail-shut); }
    html.light {
      color-scheme: light;
      --bg: #fafafa;
      --surface: rgba(255,255,255,.75); --surface-2: #fff; --field: #fff;
      --bar: rgba(250,250,250,.8); --bar-line: #e4e4e7; --rail-bg: #f4f4f5; --srcbar-bg: #f4f4f5;
      --switch-bg: rgba(228,228,231,.6); --pop-bg: #fff; --pop-shadow: rgba(0,0,0,.18); --thumb: #d4d4d8;
      --line: #e4e4e7; --line-2: #d4d4d8; --rule: #e4e4e7;
      --fg: #09090b; --fg-2: #27272a; --fg-3: #52525b; --fg-4: #63636b; --fg-5: #76767f;
      --scrim: rgba(9,9,11,.35); --media-bg: #e4e4e7; --code-bg: #f4f4f5;
      --accent: #4338ca; --accent-ink: #fff;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { margin: 0; padding-top: var(--srcbar-h); background: var(--bg); color: var(--fg); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--thumb); border-radius: 3px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    .skip { position: absolute; left: -9999px; top: 40px; z-index: 80; padding: 6px 12px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .skip:focus { left: 16px; }

    /* Source bar */
    .src-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 70; height: var(--srcbar-h); display: flex; align-items: center; gap: 16px; padding: 0 var(--gutter); background: var(--srcbar-bg); border-bottom: 1px solid var(--bar-line); font-size: 12px; }
    .src-note { margin: 0; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--fg-4); }
    .src-note strong { font-weight: 600; color: var(--accent); }
    .src-link { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 6px; color: var(--fg-3); font-weight: 500; transition: color .15s; }
    .src-link:hover { color: var(--fg); }

    /* Content sidebar: the collections. Collapses away on desktop; a drawer over a scrim on phones. */
    .side { position: fixed; top: var(--srcbar-h); left: 0; bottom: 0; width: var(--rail-open); z-index: 41; display: flex; flex-direction: column; background: var(--rail-bg); border-right: 1px solid var(--bar-line); transform: translateX(0); transition: transform .18s var(--ease), visibility .18s; }
    /* Hidden, not just off-screen, when closed, so Tab never lands in it. */
    html.rail-collapsed .side { transform: translateX(-100%); visibility: hidden; }
    .side-brand { flex: none; display: flex; align-items: center; gap: 10px; height: var(--topbar-h); padding: 0 14px; border-bottom: 1px solid var(--bar-line); font-weight: 600; letter-spacing: -.005em; }
    .side-brand svg { width: 26px; height: 26px; flex: none; }
    .side-list { flex: 1; overflow-y: auto; padding: 10px 8px 16px; }
    .glabel { padding: 12px 11px 6px; font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .14em; color: var(--fg-5); }
    .col-btn { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 11px; border: 0; border-radius: 9px; background: transparent; color: var(--fg-2); font-size: 13px; font-weight: 500; text-align: left; cursor: pointer; transition: background .15s, color .15s; }
    .col-btn:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--fg); }
    .col-btn[aria-current="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--fg); }
    .col-btn[aria-current="true"]::before { content: ""; position: absolute; left: -8px; top: 50%; transform: translateY(-50%); width: 3px; height: 18px; border-radius: 0 3px 3px 0; background: var(--accent); }
    .col-name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .count { flex: none; font: 500 11px var(--mono); color: var(--fg-4); }
    .scrim { display: none; }

    /* Top bar */
    .topbar { position: sticky; top: var(--srcbar-h); z-index: 40; margin-left: var(--rail-w); height: var(--topbar-h); display: flex; align-items: center; gap: 12px; padding: 0 var(--gutter); background: var(--bar); backdrop-filter: blur(14px) saturate(150%); -webkit-backdrop-filter: blur(14px) saturate(150%); border-bottom: 1px solid var(--bar-line); transition: margin-left .18s var(--ease); }
    .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex: none; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg-4); cursor: pointer; transition: color .15s, background .15s, border-color .15s; }
    .icon-btn:hover { color: var(--fg); background: color-mix(in srgb, var(--accent) 10%, transparent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
    .icon-btn svg { width: 17px; height: 17px; }
    .crumb { min-width: 0; color: var(--fg-4); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crumb strong { color: var(--fg); font-weight: 500; }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
    .search { width: 220px; height: 32px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: var(--r-md); background: var(--field); color: var(--fg); font: 13px var(--sans); }
    .search::placeholder { color: var(--fg-4); }
    .theme-sw { display: inline-flex; align-items: center; gap: 2px; padding: 2px; border-radius: 12px; background: var(--switch-bg); flex: none; }
    .theme-sw button { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 24px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: var(--fg-4); cursor: pointer; transition: color .15s, background-color .15s; }
    .theme-sw button:hover { color: var(--fg); }
    .theme-sw button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
    .theme-sw svg { width: 13px; height: 13px; }

    /* Main */
    main { margin-left: var(--rail-w); padding: 26px var(--gutter) 56px; transition: margin-left .18s var(--ease); }
    .shell { max-width: min(100%, 1320px); }
    .eyebrow { font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 6px 0 0; font-size: 24px; letter-spacing: -.025em; font-weight: 650; overflow-wrap: anywhere; }
    .sub { margin: 6px 0 0; color: var(--fg-3); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(272px, 100%), 1fr)); gap: 14px; margin-top: 22px; }
    .card { position: relative; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); transition: background .18s var(--ease), transform .18s var(--ease), border-color .18s; }
    .card:hover { background: var(--surface-2); transform: translateY(-2px); border-color: var(--line-2); }
    .thumb { aspect-ratio: 16 / 10; background: var(--media-bg); overflow: hidden; display: grid; place-items: center; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb .ph { font: 600 30px var(--mono); color: color-mix(in srgb, var(--accent) 55%, var(--fg-5)); }
    .card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
    .card h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
    .card p { margin: 0; color: var(--fg-3); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; font: 500 11px var(--mono); color: var(--fg-4); }
    .tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--fg-3); font: 500 11px var(--mono); }
    .tag.accent { border-color: color-mix(in srgb, var(--accent) 35%, transparent); color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .empty { margin-top: 40px; padding: 28px; border: 1px dashed var(--line-2); border-radius: var(--r-lg); color: var(--fg-3); text-align: center; }

    /* Detail */
    .back { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: var(--r-md); background: var(--field); color: var(--fg-2); cursor: pointer; font-size: 13px; }
    .back:hover { color: var(--fg); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
    .detail-head { margin-top: 16px; }
    .detail-head .summary { margin: 10px 0 0; max-width: 72ch; color: var(--fg-2); font-size: 15px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: var(--r-md); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
    .btn-primary { background: var(--accent); color: var(--accent-ink); }
    .btn-primary:hover { box-shadow: 0 0 24px -6px var(--accent); }
    .btn-ghost { border-color: var(--line-2); color: var(--fg-2); background: var(--field); }
    .btn-ghost:hover { color: var(--fg); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
    .media { margin-top: 20px; display: grid; gap: 14px; }
    .hero-img { width: 100%; max-height: 70vh; object-fit: contain; border-radius: var(--r-lg); background: var(--media-bg); outline: 1px solid var(--line-2); outline-offset: -1px; }
    .frame { width: 100%; height: min(78vh, 760px); height: min(78dvh, 760px); border: 1px solid var(--line-2); border-radius: var(--r-lg); background: var(--media-bg); }
    audio { width: 100%; }
    video { width: min(100%, 420px); border-radius: var(--r-lg); background: var(--media-bg); }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 10px; }
    .gallery a { display: block; border-radius: var(--r-md); overflow: hidden; background: var(--media-bg); outline: 1px solid var(--line-2); outline-offset: -1px; aspect-ratio: 1; }
    .gallery img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .doc { margin-top: 26px; padding: 22px 26px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); max-width: 860px; color: var(--fg-2); overflow-wrap: anywhere; }
    .doc + .doc { margin-top: 14px; }
    .doc .doc-label { margin-bottom: 10px; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-4); }
    .doc h1, .doc h2, .doc h3 { color: var(--fg); letter-spacing: -.015em; line-height: 1.3; }
    .doc h1 { font-size: 22px; } .doc h2 { font-size: 18px; margin-top: 1.6em; } .doc h3 { font-size: 15px; }
    .doc a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .doc code { font: 12.5px var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
    .doc pre { overflow-x: auto; background: var(--code-bg); padding: 12px 14px; border-radius: var(--r-md); }
    .doc pre code { background: none; padding: 0; }
    .doc blockquote { margin: 1em 0; padding: 2px 16px; border-left: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); color: var(--fg-3); }
    .doc table { border-collapse: collapse; display: block; overflow-x: auto; }
    .doc th, .doc td { border: 1px solid var(--line-2); padding: 6px 10px; text-align: left; }
    .doc img { max-width: 100%; }
    .files { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 6px; }
    .files a { font: 500 12px var(--mono); color: var(--fg-3); border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 10px; overflow-wrap: anywhere; }
    .files a:hover { color: var(--fg); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
    .fields { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }

    /* Phone: the sidebar becomes a drawer over a scrim. */
    @media (max-width: 760px) { .crumb { display: none; } .search { width: 150px; } }
    @media (max-width: 720px) {
      :root { --rail-w: 0px; }
      html.rail-collapsed { --rail-w: 0px; }
      .side, html.rail-collapsed .side { width: min(var(--rail-open), 82%); transform: translateX(-100%); visibility: hidden; z-index: 60; box-shadow: 0 0 40px -8px var(--pop-shadow); }
      html.drawer-open .side { transform: translateX(0); visibility: visible; }
      html.drawer-open .scrim { display: block; position: fixed; inset: var(--srcbar-h) 0 0 0; z-index: 55; background: var(--scrim); }
    }
    @media (max-width: 600px) {
      input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]), select, textarea { font-size: 16px; }
      .search { height: 40px; width: 100%; }
      .topbar-right { flex: 1; min-width: 0; }
      .theme-sw button { width: 36px; height: 32px; }
      .icon-btn { width: 40px; height: 40px; }
      .src-link { align-self: stretch; }
      .col-btn { height: 40px; }
      .btn, .back { height: 40px; }
      .doc { padding: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div class="src-bar">
  <p class="src-note"><strong>AI Automation Recipes</strong> &middot; everything your scheduled recipes have made, in one place.</p>
  <a class="src-link" href="https://github.com/ai-automation-tools/ai-automation-recipes" target="_blank" rel="noopener">

  </a>
</div>

<aside class="side" id="side" aria-label="Collections">
  <div class="side-brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#0b0b0e"/><rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="#474d88" stroke-width="2"/><g transform="translate(6 6) scale(0.8333)" fill="none" stroke="#818cf8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17.5 13.5v7M14 17h7"/></g></svg>
    <span>Recipes Viewer</span>
  </div>
  <div class="side-list" id="sideList"></div>
</aside>
<div class="scrim" id="scrim"></div>

<header class="topbar">
  <button class="icon-btn" id="railToggle" type="button" aria-label="Hide collections" aria-expanded="true" aria-controls="side">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
  </button>
  <div class="crumb" id="crumb">Recipes / <strong>All</strong></div>
  <div class="topbar-right">
    <input class="search" id="search" type="search" placeholder="Search titles and summaries" aria-label="Search" />

      <button type="button" data-theme="light" aria-pressed="false" aria-label="Light theme" title="Light theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></button>
      <button type="button" data-theme="dark" aria-pressed="true" aria-label="Dark theme" title="Dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg></button>
    </div>
  </div>

<script src="catalog.js"></script>
<script>
  const d = document.documentElement;
  const CATALOG = window.CATALOG || { title: 'AI Recipes', generated: '', groups: [], items: [] };
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // Asset paths in the catalog are relative to this page; encode each segment, keep the slashes.
  const url = p => p.split('/').map(encodeURIComponent).join('/');

  // Theme switch. THEME_DEFAULT must equal the pre-paint default in <head>.
  const THEME_KEY = 'ai-automation-recipes.theme', THEME_DEFAULT = 'dark';
  const themeBtns = document.querySelectorAll('#themeSw button');
  function setTheme(t) {
    d.classList.remove('light', 'dark'); d.classList.add(t);
    themeBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === t)));
    document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#fafafa' : '#060606');
  }
  setTheme(d.classList.contains('light') ? 'light' : THEME_DEFAULT);
  themeBtns.forEach(b => b.addEventListener('click', () => { setTheme(b.dataset.theme); try { localStorage.setItem(THEME_KEY, b.dataset.theme); } catch (e) {} }));

  // Sidebar: collapses on desktop (persisted), opens as a drawer on phones.
  const railToggle = $('#railToggle'), phone = () => matchMedia('(max-width: 720px)').matches;
  function syncRail() {
    const open = phone() ? d.classList.contains('drawer-open') : !d.classList.contains('rail-collapsed');
    railToggle.setAttribute('aria-expanded', String(open));
    railToggle.setAttribute('aria-label', open ? 'Hide collections' : 'Show collections');
  }
  railToggle.addEventListener('click', () => {
    if (phone()) d.classList.toggle('drawer-open');
    else { const shut = d.classList.toggle('rail-collapsed'); try { localStorage.setItem('ai-automation-recipes.rail', shut ? 'shut' : 'open'); } catch (e) {} }
    syncRail();
  });
  $('#scrim').addEventListener('click', () => { d.classList.remove('drawer-open'); syncRail(); });
  addEventListener('resize', syncRail); syncRail();

  // Sidebar list: All, then each group's collections with counts.
  const byCollection = {};
  CATALOG.items.forEach(it => (byCollection[it.collection] ||= []).push(it));
  function sidebar(active) {
    const btn = (key, label, n) => `<button class="col-btn" type="button" data-col="${esc(key)}" aria-current="${active === key}"><span class="col-name">${esc(label)}</span><span class="count">${n}</span></button>`;
    let html = btn('', 'Everything', CATALOG.items.length);
    CATALOG.groups.forEach(g => {
      const cols = g.collections.filter(c => byCollection[c.id]);
      if (!cols.length) return;
      html += `<div class="glabel">${esc(g.name)}</div>` + cols.map(c => btn(c.id, c.label, byCollection[c.id].length)).join('');
    });
    $('#sideList').innerHTML = html;
    $('#sideList').querySelectorAll('.col-btn').forEach(b => b.addEventListener('click', () => {
      location.hash = b.dataset.col ? '#/c/' + encodeURIComponent(b.dataset.col) : '#/';
      d.classList.remove('drawer-open'); syncRail();
    }));
  }
  const labelOf = col => (CATALOG.groups.flatMap(g => g.collections).find(c => c.id === col) || { label: col }).label;

  function card(it) {
    const thumb = it.thumb ? `<img src="${url(it.thumb)}" alt="" loading="lazy">` : `<span class="ph">${esc((it.title || '?')[0])}</span>`;
    return `<a class="card" href="#/a/${encodeURIComponent(it.id)}">
      <div class="thumb">${thumb}</div>
      <div class="card-body"><h3>${esc(it.title)}</h3><p>${esc(it.summary)}</p>
      <div class="meta"><span class="tag accent">${esc(labelOf(it.collection))}</span><span>${esc(it.date)}</span></div></div></a>`;
  }

  function listView(col) {
    const q = $('#search').value.trim().toLowerCase();
    let items = col ? (byCollection[col] || []) : CATALOG.items;
    if (q) items = items.filter(it => (it.title + ' ' + it.summary).toLowerCase().includes(q));
    const name = col ? labelOf(col) : 'Everything';
    $('#crumb').innerHTML = `Recipes / <strong>${esc(name)}</strong>`;
    document.title = `${name} · ${CATALOG.title}`;
    $('#view').innerHTML = `<div class="eyebrow">${esc(CATALOG.title)}</div><h1>${esc(name)}</h1>
      <p class="sub">${items.length} item${items.length === 1 ? '' : 's'}${CATALOG.generated ? ' · catalog built ' + esc(CATALOG.generated) : ''}</p>
      ${items.length ? `<div class="grid">${items.map(card).join('')}</div>` :
        `<div class="empty">${CATALOG.items.length ? 'Nothing matches.' : 'No artifacts yet. Run a recipe, then rebuild the viewer.'}</div>`}`;
    sidebar(col || '');
  }

  function detailView(id) {
    const it = CATALOG.items.find(x => x.id === id);
    if (!it) return listView('');
    $('#crumb').innerHTML = `Recipes / ${esc(labelOf(it.collection))} / <strong>${esc(it.title)}</strong>`;
    document.title = `${it.title} · ${CATALOG.title}`;
    const media = [];
    if (it.html) media.push(`<iframe class="frame" src="${url(it.html)}" sandbox="allow-scripts allow-popups allow-forms" title="${esc(it.title)}" loading="lazy"></iframe>`);
    // One image and no cover (a comic, a poster): show it large rather than as a one-item gallery.
    const solo = !it.html && !it.cover && it.gallery.length === 1 ? it.gallery[0] : null;
    if (solo) media.push(`<img class="hero-img" src="${url(solo)}" alt="${esc(it.title)}">`);
    else if (!it.html && it.cover && !it.gallery.length) media.push(`<img class="hero-img" src="${url(it.cover)}" alt="${esc(it.title)} cover">`);
    it.audio.forEach(a => media.push(`<audio controls preload="none" src="${url(a)}"></audio>`));
    it.video.forEach(v => media.push(`<video controls preload="none" src="${url(v)}"></video>`));
    if (it.gallery.length && !solo) media.push(`<div class="gallery">${it.gallery.map(g => `<a href="${url(g)}" target="_blank" rel="noopener"><img src="${url(g)}" alt="" loading="lazy"></a>`).join('')}</div>`);
    const fields = Object.entries(it.fields || {}).filter(([, v]) => v !== null && typeof v !== 'object' && String(v).length < 60)
      .map(([k, v]) => `<span class="tag">${esc(k.replace(/_/g, ' '))}: ${esc(v)}</span>`).join('');
    const actions = [];
    if (it.html) actions.push(`<a class="btn btn-primary" href="${url(it.html)}" target="_blank" rel="noopener">Open full screen</a>`);
    (it.pages || []).forEach(p => actions.push(`<a class="btn btn-ghost" href="${url(p)}" target="_blank" rel="noopener">${esc(p.split('/').pop().replace(/\.html$/, '').replace(/-/g, ' '))}</a>`));
    if (CATALOG.repo && it.recipe) {
      actions.push(`<a class="btn btn-ghost" href="${esc(CATALOG.repo)}/tree/main/recipes/${encodeURIComponent(it.recipe)}" target="_blank" rel="noopener">The recipe</a>`);
      if (it.template) actions.push(`<a class="btn btn-ghost" href="${esc(CATALOG.repo)}/blob/main/registry/templates/recipe-${encodeURIComponent(it.recipe)}.json" target="_blank" rel="noopener">Cronsole template</a>`);
    } else actions.push(`<a class="btn btn-ghost" href="${url(it.folder)}/" target="_blank" rel="noopener">Open folder</a>`);
    $('#view').innerHTML = `<button class="back" type="button" id="back">&larr; Back</button>
      <div class="detail-head"><div class="eyebrow">${esc(labelOf(it.collection))} · ${esc(it.date)}</div><h1>${esc(it.title)}</h1>
      <p class="summary">${esc(it.summary)}</p><div class="fields">${fields}</div><div class="actions">${actions.join('')}</div></div>
      <div class="media">${media.join('')}</div>
      ${it.docs.map(doc => `<article class="doc"><div class="doc-label">${esc(doc.name)}</div>${doc.html}</article>`).join('')}
      <div class="files">${it.files.map(f => `<a href="${url(f)}" target="_blank" rel="noopener">${esc(f.split('/').slice(-2).join('/'))}</a>`).join('')}</div>`;
    $('#back').addEventListener('click', () => history.length > 1 ? history.back() : (location.hash = '#/'));
    sidebar(it.collection);
    scrollTo(0, 0);
  }

  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h.startsWith('/a/')) detailView(h.slice(3));
    else listView(h.startsWith('/c/') ? h.slice(3) : '');
  }
  $('#search').addEventListener('input', () => { if (location.hash.startsWith('#/a/')) location.hash = '#/'; else route(); });
  addEventListener('hashchange', route);
  route();
</script>
</body>
</html>
