<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Reef Rush</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #04141c;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .backdrop {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 15%, #0d3b4a 0%, #041017 72%);
    box-sizing: border-box;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
             max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  }
  .phone {
    position: relative;
    width: min(92vw, 42.5vh, 430px);
    aspect-ratio: 9 / 19.5;
    background: #0b1b22;
    border-radius: 46px;
    border: 10px solid #17303a;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.04);
  }
  .notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 38%; height: 20px; background: #17303a;
    border-radius: 0 0 16px 16px; z-index: 5;
  }
  .screen {
    position: absolute; inset: 13px;
    border-radius: 32px; overflow: hidden; background: #062028;
  }
  .home-indicator {
    position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
    width: 34%; height: 5px; border-radius: 3px; background: rgba(255,255,255,.28);
    z-index: 5;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<div class="backdrop">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen"><canvas id="game"></canvas></div>
    <div class="home-indicator"></div>
  </div>
</div>

<script>
/*
  Reef Rush — match-3 (mobile)
  Swap two adjacent reef gems to line up 3+ of a kind before the tide runs out.
  Bigger matches create special gems (Pearl / Current) — match or swap them
  together to detonate for a much bigger tide refill.

  Controls
    Touch/mouse : drag from a gem toward a neighbor to swap, or tap-tap two
                  adjacent gems.
    Keyboard    : Arrow keys move the cursor, Enter/Space picks it up and
                  swaps with an adjacent cell on a second press. R restarts.
*/
(function () {
  'use strict';

  // ---------- DOM refs (grabbed once, up front — script is last in <body>) ----------
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var screenEl = document.querySelector('.screen');

  // ---------- constants ----------
  var COLORS = [
    { a: '#ff7a7a', b: '#c23b4f' }, // coral
    { a: '#3ee6c8', b: '#0f9e8c' }, // teal
    { a: '#ffd166', b: '#e0983a' }, // gold
    { a: '#c39bff', b: '#7a4fd1' }, // violet
    { a: '#ff9f5b', b: '#e0642a' }  // sunset
  ];
  var COLS = 6, ROWS = 8;
  var SWAP_TIME = 0.15, CLEAR_TIME = 0.20, FALL_DELAY = 0.30;
  var TIDE_START = 26, TIDE_MAX = 40;
  var BASE_SCORE_PER_CELL = 10;
  var TIME_PER_CELL = 0.5;
  var isTouch = matchMedia('(pointer: coarse)').matches;

  var S = { TITLE: 'title', PLAY: 'play', OVER: 'over' };
  var state = S.TITLE;

  // ---------- sizing / dpr ----------
  var dpr = 1, W = 0, H = 0;
  var boardX = 0, boardY = 0, cell = 0, hudH = 92;

  function layoutBoard() {
    var marginX = 14, marginBottom = 14;
    var availW = W - marginX * 2;
    var availH = H - hudH - marginBottom;
    cell = Math.max(8, Math.min(availW / COLS, availH / ROWS));
    var boardW = cell * COLS, boardH = cell * ROWS;
    boardX = (W - boardW) / 2;
    boardY = hudH + (availH - boardH) / 2;
  }

  function resize() {
    var r = screenEl.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layoutBoard();
  }
  window.addEventListener('resize', resize);

  // ---------- grid ----------
  function idx(r, c) { return r * COLS + c; }
  function newCell(type) { return { type: type, special: null, offX: 0, offY: 0, popT: 0, popping: false, kelp: false }; }
  var grid = [];
  for (var i = 0; i < COLS * ROWS; i++) grid.push(newCell(0));

  function randColorAvoiding(r, c) {
    var tries = 0;
    while (true) {
      var t = (Math.random() * COLORS.length) | 0;
      tries++;
      if (tries > 25) return t;
      if (c >= 2 && grid[idx(r, c - 1)].type === t && !grid[idx(r, c - 1)].kelp &&
          grid[idx(r, c - 2)].type === t && !grid[idx(r, c - 2)].kelp) continue;
      if (r >= 2 && grid[idx(r - 1, c)].type === t && !grid[idx(r - 1, c)].kelp &&
          grid[idx(r - 2, c)].type === t && !grid[idx(r - 2, c)].kelp) continue;
      return t;
    }
  }

  function initBoard() {
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var cl = grid[idx(r, c)];
        cl.type = randColorAvoiding(r, c);
        cl.special = null; cl.kelp = false; cl.popping = false; cl.popT = 0;
        cl.offX = 0; cl.offY = 0;
      }
    }
    if (!hasValidMove()) initBoard();
  }

  // ---------- run scanning ----------
  // returns array of {cells:[idx...], len, dir:'h'|'v'} for every run >= 3
  function scanRuns() {
    var runs = [];
    var r, c, start, len;
    for (r = 0; r < ROWS; r++) {
      c = 0;
      while (c < COLS) {
        var cl = grid[idx(r, c)];
        if (cl.kelp) { c++; continue; }
        start = c; len = 1;
        while (c + 1 < COLS && !grid[idx(r, c + 1)].kelp && grid[idx(r, c + 1)].type === cl.type) { c++; len++; }
        if (len >= 3) {
          var cells = [];
          for (var k = start; k <= c; k++) cells.push(idx(r, k));
          runs.push({ cells: cells, len: len, dir: 'h' });
        }
        c++;
      }
    }
    for (c = 0; c < COLS; c++) {
      r = 0;
      while (r < ROWS) {
        var cl2 = grid[idx(r, c)];
        if (cl2.kelp) { r++; continue; }
        start = r; len = 1;
        while (r + 1 < ROWS && !grid[idx(r + 1, c)].kelp && grid[idx(r + 1, c)].type === cl2.type) { r++; len++; }
        if (len >= 3) {
          var cells2 = [];
          for (var k2 = start; k2 <= r; k2++) cells2.push(idx(k2, c));
          runs.push({ cells: cells2, len: len, dir: 'v' });
        }
        r++;
      }
    }
    return runs;
  }

  function hasAnyMatch() { return scanRuns().length > 0; }

  function hasValidMove() {
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        if (grid[idx(r, c)].kelp) continue;
        if (c + 1 < COLS && !grid[idx(r, c + 1)].kelp) {
          swapTypes(idx(r, c), idx(r, c + 1));
          var ok = hasAnyMatch();
          swapTypes(idx(r, c), idx(r, c + 1));
          if (ok) return true;
        }
        if (r + 1 < ROWS && !grid[idx(r + 1, c)].kelp) {
          swapTypes(idx(r, c), idx(r + 1, c));
          var ok2 = hasAnyMatch();
          swapTypes(idx(r, c), idx(r + 1, c));
          if (ok2) return true;
        }
      }
    }
    return false;
  }

  function swapTypes(i1, i2) {
    var a = grid[i1], b = grid[i2];
    var t = a.type; a.type = b.type; b.type = t;
    var s = a.special; a.special = b.special; b.special = s;
  }

  function reshuffle() {
    var tries = 0;
    do {
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          var cl = grid[idx(r, c)];
          if (!cl.kelp) cl.type = randColorAvoiding(r, c);
        }
      }
      tries++;
    } while ((!hasValidMove() || hasAnyMatch()) && tries < 40);
  }

  // ---------- difficulty ramp ----------
  var drainMult = 1.0, kelpChance = 0, kelpMax = 0;
  function updateDifficulty(score) {
    if (score >= 3000) drainMult = 1.55;
    else if (score >= 1800) drainMult = 1.45;
    else if (score >= 900) drainMult = 1.3;
    else if (score >= 300) drainMult = 1.15;
    else drainMult = 1.0;

    if (score >= 900) { kelpChance = 0.16; kelpMax = 5; }
    else if (score >= 300) { kelpChance = 0.10; kelpMax = 3; }
    else { kelpChance = 0; kelpMax = 0; }
  }

  function countKelp() {
    var n = 0;
    for (var i = 0; i < grid.length; i++) if (grid[i].kelp) n++;
    return n;
  }

  // ---------- game state ----------
  var score = 0, best = 0, tide = TIDE_START, chainLevel = 0;
  var phase = 'idle'; // idle | swap | revert | clear | fall
  var phaseT = 0;
  var swapA = -1, swapB = -1, comboSwap = false;
  var clearedSet = null; // array of indices cleared this resolve step
  var scoreStr = 'Score 0', bestStr = 'Best 0';
  try { best = parseInt(localStorage.getItem('reefRushBest') || '0', 10) || 0; } catch (e) { best = 0; }
  bestStr = 'Best ' + best;

  function setScore(v) { score = v; scoreStr = 'Score ' + score; }

  // selection / input
  var selR = -1, selC = -1;
  var cursorR = 0, cursorC = 0;
  var dragStartIdx = -1, dragging = false, dragX = 0, dragY = 0;

  // floating text pool
  var floaters = [];
  for (var fi = 0; fi < 8; fi++) floaters.push({ alive: false, x: 0, y: 0, vy: 0, life: 0, text: '' });
  function spawnFloater(x, y, text) {
    for (var i = 0; i < floaters.length; i++) {
      if (!floaters[i].alive) {
        var f = floaters[i];
        f.alive = true; f.x = x; f.y = y; f.vy = -34; f.life = 0.9; f.text = text;
        return;
      }
    }
  }

  var shake = 0, freeze = 0;
  function addShake(a) { shake = Math.min(shake + a, 10); }

  // ---------- audio ----------
  var actx = null;
  function audio() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function sfx(o) {
    var a = audio();
    if (a.state !== 'running') return;
    var t = a.currentTime;
    var osc = a.createOscillator(), gain = a.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + o.dur);
    gain.gain.setValueAtTime(o.vol || 0.22, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    osc.connect(gain).connect(a.destination);
    osc.start(t); osc.stop(t + o.dur);
  }
  function sfxSwap() { sfx({ freq: 300, to: 420, type: 'sine', dur: 0.09, vol: 0.16 }); }
  function sfxBad() { sfx({ freq: 180, to: 120, type: 'triangle', dur: 0.12, vol: 0.16 }); }
  function sfxMatch(n) { sfx({ freq: 500 + n * 30, to: 900 + n * 30, type: 'square', dur: 0.12, vol: 0.2 }); }
  function sfxSpecial() { sfx({ freq: 260, to: 900, type: 'sawtooth', dur: 0.22, vol: 0.22 }); }
  function sfxOver() { sfx({ freq: 220, to: 50, type: 'sine', dur: 0.6, vol: 0.28 }); }

  // ---------- board coordinate helpers ----------
  function cellPX(r, c) { return boardX + c * cell; }
  function cellPY(r, c) { return boardY + r * cell; }

  function pixelToCell(px, py) {
    var c = Math.floor((px - boardX) / cell);
    var r = Math.floor((py - boardY) / cell);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
    return { r: r, c: c };
  }

  function isAdjacent(r1, c1, r2, c2) {
    var dr = Math.abs(r1 - r2), dc = Math.abs(c1 - c2);
    return (dr + dc) === 1;
  }

  // ---------- resolve pipeline ----------
  function trySwap(r1, c1, r2, c2) {
    if (phase !== 'idle') return;
    if (!isAdjacent(r1, c1, r2, c2)) return;
    var i1 = idx(r1, c1), i2 = idx(r2, c2);
    if (grid[i1].kelp || grid[i2].kelp) { sfxBad(); return; }
    swapA = i1; swapB = i2;
    comboSwap = !!(grid[i1].special && grid[i2].special);
    phase = 'swap'; phaseT = 0;
    sfxSwap();
  }

  function beginClearFromMatch() {
    var runs = scanRuns();
    if (runs.length === 0) return false;

    // union-find style clustering: connect cells that share an index
    var parent = {};
    function find(x) { while (parent[x] !== undefined && parent[x] !== x) x = parent[x]; return x; }
    function union(x, y) {
      var rx = find(x), ry = find(y);
      if (rx !== ry) parent[rx] = ry;
    }
    var runInfo = {}; // cellIndex -> {maxLen, dir}
    var i;
    for (i = 0; i < runs.length; i++) {
      var run = runs[i];
      for (var k = 0; k < run.cells.length; k++) {
        var ci = run.cells[k];
        if (parent[ci] === undefined) parent[ci] = ci;
        if (!runInfo[ci] || runInfo[ci].maxLen < run.len) runInfo[ci] = { maxLen: run.len, dir: run.dir };
      }
      for (var k2 = 1; k2 < run.cells.length; k2++) union(run.cells[0], run.cells[k2]);
    }
    // merge runs sharing a cell (L/T shapes)
    var seen = {};
    for (i = 0; i < runs.length; i++) {
      for (var k3 = 0; k3 < runs[i].cells.length; k3++) {
        var ci2 = runs[i].cells[k3];
        if (seen[ci2] !== undefined && seen[ci2] !== i) {
          union(runs[seen[ci2]].cells[0], runs[i].cells[0]);
        }
        seen[ci2] = i;
      }
    }
    var clusters = {};
    var allCells = Object.keys(parent).map(Number);
    for (i = 0; i < allCells.length; i++) {
      var root = find(allCells[i]);
      if (!clusters[root]) clusters[root] = [];
      clusters[root].push(allCells[i]);
    }

    var toClear = {};
    var newSpecials = []; // {index, kind, dir}
    var lastSwapCells = swapA >= 0 ? [swapA, swapB] : [];

    Object.keys(clusters).forEach(function (key) {
      var cells = clusters[key];
      var maxLen = 0;
      for (var j = 0; j < cells.length; j++) {
        toClear[cells[j]] = true;
        if (runInfo[cells[j]].maxLen > maxLen) maxLen = runInfo[cells[j]].maxLen;
      }
      if (maxLen >= 4) {
        var loc = -1;
        for (var j2 = 0; j2 < lastSwapCells.length; j2++) {
          if (cells.indexOf(lastSwapCells[j2]) !== -1) { loc = lastSwapCells[j2]; break; }
        }
        if (loc === -1) loc = cells[(cells.length / 2) | 0];
        var kind = maxLen >= 5 ? 'current' : 'pearl';
        var dir = 'h';
        for (var j3 = 0; j3 < cells.length; j3++) {
          if (runInfo[cells[j3]].maxLen === maxLen) { dir = runInfo[cells[j3]].dir; break; }
        }
        newSpecials.push({ index: loc, kind: kind, dir: dir });
        delete toClear[loc]; // this cell survives and becomes the special gem instead of clearing
      }
    });

    expandWithKelpAndSpecials(toClear, newSpecials);
    return true;
  }

  function expandWithKelpAndSpecials(toClear, newSpecials) {
    // trigger any existing specials caught in the clear set (chain detonation)
    var queue = Object.keys(toClear).map(Number);
    var processedSpecial = {};
    while (queue.length) {
      var ci = queue.pop();
      var cl = grid[ci];
      if (cl.special && !processedSpecial[ci]) {
        processedSpecial[ci] = true;
        var footprint = specialFootprint(ci, cl.special);
        for (var f = 0; f < footprint.length; f++) {
          if (!toClear[footprint[f]]) { toClear[footprint[f]] = true; queue.push(footprint[f]); }
        }
      }
    }
    // destroy kelp adjacent to any cleared cell
    var clearedList = Object.keys(toClear).map(Number);
    for (var i = 0; i < clearedList.length; i++) {
      var r = (clearedList[i] / COLS) | 0, c = clearedList[i] % COLS;
      var neigh = [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]];
      for (var n = 0; n < neigh.length; n++) {
        var nr = neigh[n][0], nc = neigh[n][1];
        if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
        var ni = idx(nr, nc);
        if (grid[ni].kelp) toClear[ni] = true;
      }
    }
    clearedSet = Object.keys(toClear).map(Number);
    pendingSpecials = newSpecials;

    for (var s = 0; s < clearedSet.length; s++) {
      grid[clearedSet[s]].popping = true;
      grid[clearedSet[s]].popT = 0;
    }
    chainLevel++;
    var mult = Math.min(1 + (chainLevel - 1) * 0.5, 3);
    var gained = Math.round(clearedSet.length * BASE_SCORE_PER_CELL * mult);
    setScore(score + gained);
    var timeGain = clearedSet.length * TIME_PER_CELL * (1 + 0.15 * (chainLevel - 1));
    tide = Math.min(tide + timeGain, TIDE_MAX);
    updateDifficulty(score);

    if (clearedSet.length >= 5) { freeze = 0.05; addShake(4 + clearedSet.length * 0.4); sfxSpecial(); }
    else { addShake(2); sfxMatch(clearedSet.length); }
    if (chainLevel > 1) {
      var cx = boardX + COLS * cell / 2, cy = boardY + ROWS * cell / 2;
      spawnFloater(cx, cy, 'Chain x' + chainLevel + '!');
    }

    phase = 'clear'; phaseT = 0;
  }

  var pendingSpecials = [];

  function specialFootprint(index, kind) {
    var r = (index / COLS) | 0, c = index % COLS;
    var out = [];
    if (kind === 'pearl') {
      for (var dr = -1; dr <= 1; dr++) {
        for (var dc = -1; dc <= 1; dc++) {
          var rr = r + dr, cc = c + dc;
          if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) out.push(idx(rr, cc));
        }
      }
    } else if (kind === 'curH') {
      for (var cc2 = 0; cc2 < COLS; cc2++) out.push(idx(r, cc2));
    } else if (kind === 'curV') {
      for (var rr2 = 0; rr2 < ROWS; rr2++) out.push(idx(rr2, c));
    }
    return out;
  }

  function finalizeClear() {
    // remove cleared cells from data, compact columns, spawn new on top
    for (var c = 0; c < COLS; c++) {
      var survivors = []; // top-to-bottom original order, preserved so gravity is correct
      for (var r = 0; r < ROWS; r++) {
        var i = idx(r, c);
        if (clearedSet.indexOf(i) === -1) survivors.push(grid[i]);
      }
      var missing = ROWS - survivors.length;
      var spawned = [];
      for (var m = 0; m < missing; m++) spawned.push(makeSpawnCell(c));
      var full = spawned.concat(survivors); // new cells at top, survivors settle to the bottom
      for (var r2 = 0; r2 < ROWS; r2++) {
        var target = grid[idx(r2, c)];
        var src = full[r2];
        target.type = src.type;
        target.special = src.special;
        target.kelp = src.kelp;
        target.popping = false;
        target.popT = 0;
        // visual: everything eases in from above
        target.offY = -cell * (r2 < missing ? (missing - r2 + 0.4) : 0.9);
      }
    }
    // apply queued specials from the match that just resolved
    for (var s = 0; s < pendingSpecials.length; s++) {
      var p = pendingSpecials[s];
      if (clearedSet.indexOf(p.index) !== -1) continue; // spot got cleared by a chain detonation, skip
      var kind = p.kind === 'current' ? (p.dir === 'h' ? 'curH' : 'curV') : 'pearl';
      grid[p.index].special = kind;
    }
    pendingSpecials = [];
    swapA = -1; swapB = -1; comboSwap = false;
    phase = 'fall'; phaseT = 0;
  }

  function makeSpawnCell(c) {
    var kelp = kelpChance > 0 && countKelp() < kelpMax && Math.random() < kelpChance;
    var cl = newCell((Math.random() * COLORS.length) | 0);
    cl.kelp = kelp;
    return cl;
  }

  function afterFallSettle() {
    if (beginClearFromMatch()) return; // cascades again
    chainLevel = 0;
    if (!hasValidMove()) reshuffle();
    phase = 'idle'; phaseT = 0;
  }

  // ---------- update ----------
  var lastT = null;
  function update(dt) {
    if (freeze > 0) { freeze -= dt; if (freeze < 0) { dt = -freeze; freeze = 0; } else return; }
    shake *= Math.pow(0.02, dt);
    if (shake < 0.05) shake = 0;

    for (var f = 0; f < floaters.length; f++) {
      if (floaters[f].alive) {
        floaters[f].life -= dt;
        floaters[f].y += floaters[f].vy * dt;
        if (floaters[f].life <= 0) floaters[f].alive = false;
      }
    }

    // ease all offsets toward 0
    var ease = 1 - Math.pow(0.0025, dt);
    for (var i = 0; i < grid.length; i++) {
      var cl = grid[i];
      if (cl.offY !== 0) { cl.offY *= (1 - ease); if (Math.abs(cl.offY) < 0.5) cl.offY = 0; }
      if (cl.offX !== 0) { cl.offX *= (1 - ease); if (Math.abs(cl.offX) < 0.5) cl.offX = 0; }
      if (cl.popping) { cl.popT += dt; }
    }

    if (state !== S.PLAY) return;

    tide -= dt * drainMult;
    if (tide <= 0) { tide = 0; gameOver(); return; }

    if (phase === 'swap') {
      phaseT += dt;
      var t = Math.min(phaseT / SWAP_TIME, 1);
      if (t >= 1) {
        swapTypes(swapA, swapB);
        if (comboSwap) {
          var f1 = specialFootprint(swapA, grid[swapA].special === 'pearl' ? 'pearl' : grid[swapA].special);
          var f2 = specialFootprint(swapB, grid[swapB].special === 'pearl' ? 'pearl' : grid[swapB].special);
          var toClear = {};
          for (var a = 0; a < f1.length; a++) toClear[f1[a]] = true;
          for (var b = 0; b < f2.length; b++) toClear[f2[b]] = true;
          toClear[swapA] = true; toClear[swapB] = true;
          grid[swapA].special = null; grid[swapB].special = null;
          expandWithKelpAndSpecials(toClear, []);
        } else if (!beginClearFromMatch()) {
          phase = 'revert'; phaseT = 0;
          sfxBad();
        }
      }
    } else if (phase === 'revert') {
      phaseT += dt;
      if (phaseT >= SWAP_TIME) {
        swapTypes(swapA, swapB); // was never committed to data, just undo visual pairing
        swapA = -1; swapB = -1;
        phase = 'idle'; phaseT = 0;
      }
    } else if (phase === 'clear') {
      phaseT += dt;
      if (phaseT >= CLEAR_TIME) finalizeClear();
    } else if (phase === 'fall') {
      phaseT += dt;
      if (phaseT >= FALL_DELAY) afterFallSettle();
    }
  }

  function gameOver() {
    state = S.OVER;
    sfxOver();
    if (score > best) {
      best = score;
      bestStr = 'Best ' + best;
      try { localStorage.setItem('reefRushBest', String(best)); } catch (e) {}
    }
  }

  function startRun() {
    setScore(0);
    tide = TIDE_START;
    chainLevel = 0;
    drainMult = 1; kelpChance = 0; kelpMax = 0;
    phase = 'idle'; phaseT = 0;
    swapA = -1; swapB = -1; comboSwap = false;
    selR = -1; selC = -1; cursorR = 0; cursorC = 0;
    dragging = false; dragStartIdx = -1;
    for (var i = 0; i < floaters.length; i++) floaters[i].alive = false;
    initBoard();
    state = S.PLAY;
  }

  // ---------- input ----------
  function selectAt(r, c) {
    if (phase !== 'idle') return;
    if (selR === -1) { selR = r; selC = c; return; }
    if (selR === r && selC === c) { selR = -1; selC = -1; return; }
    if (isAdjacent(selR, selC, r, c)) {
      trySwap(selR, selC, r, c);
      selR = -1; selC = -1;
    } else {
      selR = r; selC = c;
    }
  }

  function onPointerDown(e) {
    audio();
    var p = pointerPos(e);
    if (state === S.TITLE) { startRun(); return; }
    if (state === S.OVER) {
      if (hitRestartButton(p.x, p.y)) startRun();
      return;
    }
    var cellPos = pixelToCell(p.x, p.y);
    if (!cellPos) return;
    dragStartIdx = idx(cellPos.r, cellPos.c);
    dragging = true;
    dragX = p.x; dragY = p.y;
  }
  function onPointerMove(e) {
    if (!dragging) return;
    var p = pointerPos(e);
    var dx = p.x - dragX, dy = p.y - dragY;
    var THRESH = cell * 0.35;
    if (Math.abs(dx) > THRESH || Math.abs(dy) > THRESH) {
      var r0 = (dragStartIdx / COLS) | 0, c0 = dragStartIdx % COLS;
      var r1 = r0, c1 = c0;
      if (Math.abs(dx) > Math.abs(dy)) c1 += dx > 0 ? 1 : -1;
      else r1 += dy > 0 ? 1 : -1;
      if (r1 >= 0 && r1 < ROWS && c1 >= 0 && c1 < COLS) {
        trySwap(r0, c0, r1, c1);
      }
      dragging = false;
      selR = -1; selC = -1;
    }
  }
  function onPointerUp(e) {
    if (dragging) {
      // treat as a tap-select
      var p = pointerPos(e);
      var cellPos = pixelToCell(p.x, p.y);
      if (cellPos) selectAt(cellPos.r, cellPos.c);
    }
    dragging = false; dragStartIdx = -1;
  }
  function pointerPos(e) {
    var r = canvas.getBoundingClientRect();
    var cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
    var cy = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
    return { x: (cx - r.left) * (canvas.width / r.width / dpr), y: (cy - r.top) * (canvas.height / r.height / dpr) };
  }

  canvas.addEventListener('pointerdown', function (e) { canvas.setPointerCapture(e.pointerId); onPointerDown(e); }, { passive: false });
  canvas.addEventListener('pointermove', onPointerMove, { passive: false });
  canvas.addEventListener('pointerup', onPointerUp, { passive: false });
  canvas.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  var restartBtn = { x: 0, y: 0, w: 160, h: 46 };
  function hitRestartButton(x, y) {
    return x >= restartBtn.x && x <= restartBtn.x + restartBtn.w &&
           y >= restartBtn.y && y <= restartBtn.y + restartBtn.h;
  }

  window.addEventListener('keydown', function (e) {
    var navKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter'];
    if (navKeys.indexOf(e.key) !== -1) e.preventDefault();
    if (e.key === 'r' || e.key === 'R') { startRun(); return; }
    if (state === S.TITLE) { if (e.key === ' ' || e.key === 'Enter') startRun(); return; }
    if (state === S.OVER) { if (e.key === ' ' || e.key === 'Enter') startRun(); return; }
    if (state !== S.PLAY) return;
    if (e.key === 'ArrowUp') cursorR = Math.max(0, cursorR - 1);
    else if (e.key === 'ArrowDown') cursorR = Math.min(ROWS - 1, cursorR + 1);
    else if (e.key === 'ArrowLeft') cursorC = Math.max(0, cursorC - 1);
    else if (e.key === 'ArrowRight') cursorC = Math.min(COLS - 1, cursorC + 1);
    else if (e.key === ' ' || e.key === 'Enter') selectAt(cursorR, cursorC);
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) lastT = null;
  });

  // ---------- render ----------
  function drawGem(x, y, size, cl) {
    var pad = size * 0.09;
    var w = size - pad * 2;
    ctx.save();
    ctx.translate(x + size / 2, y + size / 2);
    if (cl.popping) {
      var t = Math.min(cl.popT / CLEAR_TIME, 1);
      var sc = Math.max(0, 1 - t * 1.15);
      ctx.globalAlpha = Math.max(0, 1 - t);
      ctx.scale(sc, sc);
    }
    ctx.translate(cl.offX || 0, cl.offY || 0);

    if (cl.kelp) {
      ctx.fillStyle = '#0c5c3e';
      roundRect(-w / 2, -w / 2, w, w, size * 0.16);
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,255,190,0.55)';
      ctx.lineWidth = Math.max(1, size * 0.045);
      for (var i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(i * w * 0.28, -w / 2 + 4);
        ctx.quadraticCurveTo(i * w * 0.28 + w * 0.12, 0, i * w * 0.28, w / 2 - 4);
        ctx.stroke();
      }
      ctx.restore();
      return;
    }

    var col = COLORS[cl.type];
    var grad = ctx.createRadialGradient(-w * 0.15, -w * 0.15, w * 0.05, 0, 0, w * 0.62);
    grad.addColorStop(0, col.a);
    grad.addColorStop(1, col.b);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, w / 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(-w * 0.16, -w * 0.18, w * 0.16, w * 0.09, -0.5, 0, Math.PI * 2);
    ctx.fill();

    if (cl.special === 'pearl') {
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.beginPath(); ctx.arc(0, 0, w * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = col.b; ctx.lineWidth = Math.max(1.5, size * 0.04);
      ctx.beginPath(); ctx.arc(0, 0, w * 0.22, 0, Math.PI * 2); ctx.stroke();
    } else if (cl.special === 'curH' || cl.special === 'curV') {
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = Math.max(2, size * 0.07);
      ctx.lineCap = 'round';
      ctx.beginPath();
      if (cl.special === 'curH') { ctx.moveTo(-w * 0.28, 0); ctx.lineTo(w * 0.28, 0); }
      else { ctx.moveTo(0, -w * 0.28); ctx.lineTo(0, w * 0.28); }
      ctx.stroke();
    }
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0a2a34');
    bg.addColorStop(1, '#041318');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // HUD
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#eaffff';
    ctx.font = '600 20px -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(scoreStr, 18, 34);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#8fe8d8';
    ctx.font = '600 16px -apple-system, sans-serif';
    ctx.fillText(bestStr, W - 18, 34);

    var barX = 18, barY = 56, barW = W - 36, barH = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    roundRect(barX, barY, barW, barH, 8); ctx.fill();
    var frac = Math.max(0, tide / TIDE_MAX);
    var tideColor = frac > 0.45 ? '#3ee6c8' : (frac > 0.2 ? '#ffd166' : '#ff6b6b');
    ctx.fillStyle = tideColor;
    roundRect(barX, barY, Math.max(6, barW * frac), barH, 8); ctx.fill();

    // board backdrop
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    roundRect(boardX - 6, boardY - 6, COLS * cell + 12, ROWS * cell + 12, 14);
    ctx.fill();

    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var i = idx(r, c);
        var cl = grid[i];
        var x = cellPX(r, c), y = cellPY(r, c);

        if (phase === 'swap' && (i === swapA || i === swapB)) {
          var other = i === swapA ? swapB : swapA;
          var or = (other / COLS) | 0, oc = other % COLS;
          var t = Math.min(phaseT / SWAP_TIME, 1);
          var ex = (cellPX(or, oc) - x) * t;
          var ey = (cellPY(or, oc) - y) * t;
          ctx.save(); ctx.translate(ex, ey);
          drawGem(x, y, cell, cl);
          ctx.restore();
          continue;
        }
        if (phase === 'revert' && (i === swapA || i === swapB)) {
          var other2 = i === swapA ? swapB : swapA;
          var or2 = (other2 / COLS) | 0, oc2 = other2 % COLS;
          var t2 = Math.min(phaseT / SWAP_TIME, 1);
          var ex2 = (cellPX(or2, oc2) - x) * t2;
          var ey2 = (cellPY(or2, oc2) - y) * t2;
          ctx.save(); ctx.translate(ex2, ey2);
          drawGem(x, y, cell, cl);
          ctx.restore();
          continue;
        }

        if ((r === selR && c === selC) || (state === S.PLAY && r === cursorR && c === cursorC && !isTouch)) {
          ctx.strokeStyle = 'rgba(255,255,255,0.7)';
          ctx.lineWidth = 2.5;
          roundRect(x + 3, y + 3, cell - 6, cell - 6, 10);
          ctx.stroke();
        }
        drawGem(x, y, cell, cl);
      }
    }

    for (var f = 0; f < floaters.length; f++) {
      if (!floaters[f].alive) continue;
      var fl = floaters[f];
      ctx.globalAlpha = Math.max(0, fl.life / 0.9);
      ctx.fillStyle = '#ffe9a8';
      ctx.font = '700 18px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(fl.text, fl.x, fl.y);
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    if (state === S.TITLE) drawTitle();
    if (state === S.OVER) drawGameOver();
  }

  function drawTitle() {
    ctx.fillStyle = 'rgba(3,15,20,0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#eaffff';
    ctx.font = '700 30px -apple-system, sans-serif';
    ctx.fillText('Reef Rush', W / 2, H * 0.4);
    ctx.font = '400 15px -apple-system, sans-serif';
    ctx.fillStyle = '#9fd8cf';
    wrapText('Swap gems to match 3. Big matches make specials — combine them for a huge tide refill.', W / 2, H * 0.4 + 42, W - 60, 20);
    ctx.font = '600 18px -apple-system, sans-serif';
    ctx.fillStyle = '#ffd166';
    ctx.fillText(isTouch ? 'Tap to start' : 'Click or press Enter to start', W / 2, H * 0.72);
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(3,15,20,0.8)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff9f9f';
    ctx.font = '700 26px -apple-system, sans-serif';
    ctx.fillText('Tide Out', W / 2, H * 0.36);
    ctx.fillStyle = '#eaffff';
    ctx.font = '600 20px -apple-system, sans-serif';
    ctx.fillText('Score ' + score, W / 2, H * 0.36 + 40);
    ctx.fillStyle = '#8fe8d8';
    ctx.font = '500 16px -apple-system, sans-serif';
    ctx.fillText('Best ' + best, W / 2, H * 0.36 + 68);

    restartBtn.x = W / 2 - restartBtn.w / 2;
    restartBtn.y = H * 0.58;
    ctx.fillStyle = '#3ee6c8';
    roundRect(restartBtn.x, restartBtn.y, restartBtn.w, restartBtn.h, 12);
    ctx.fill();
    ctx.fillStyle = '#04222a';
    ctx.font = '700 18px -apple-system, sans-serif';
    ctx.fillText('Play Again', W / 2, restartBtn.y + restartBtn.h / 2 + 1);
    ctx.fillStyle = '#9fd8cf';
    ctx.font = '400 14px -apple-system, sans-serif';
    ctx.fillText(isTouch ? 'or tap the board' : 'or press R', W / 2, restartBtn.y + restartBtn.h + 22);
  }

  function wrapText(text, cx, y, maxW, lh) {
    var words = text.split(' ');
    var line = '', lines = [];
    for (var i = 0; i < words.length; i++) {
      var test = line + words[i] + ' ';
      if (ctx.measureText(test).width > maxW && line !== '') {
        lines.push(line); line = words[i] + ' ';
      } else line = test;
    }
    lines.push(line);
    for (var j = 0; j < lines.length; j++) ctx.fillText(lines[j].trim(), cx, y + j * lh);
  }

  // ---------- main loop ----------
  function frame(now) {
    if (lastT === null) lastT = now;
    var dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  resize();
  initBoard();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
