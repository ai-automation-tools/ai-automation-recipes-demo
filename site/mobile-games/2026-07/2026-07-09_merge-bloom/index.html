<!DOCTYPE html>
<html lang="en">
<head>
<!--
  Merge Bloom — merge puzzle mobile game
  Genre: merge puzzle
  Controls: tap column to drop (touch); click column (mouse); keys 1-5 drop; R restart
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Merge Bloom</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #1a0f2e;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden; user-select: none; touch-action: none;
}
#backdrop {
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at 50% 30%, #2d1456 0%, #0d0820 70%);
  z-index: 0;
}
.petal {
  position: fixed; pointer-events: none; z-index: 1;
  border-radius: 50% 0 50% 0;
  animation: floatPetal linear infinite;
  opacity: 0.18;
}
@keyframes floatPetal {
  0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
  10%  { opacity: 0.18; }
  90%  { opacity: 0.18; }
  100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
}
#phone {
  position: relative; z-index: 10;
  width: min(360px, 90vw);
  height: min(720px, 96vh);
  background: #111;
  border-radius: 36px;
  box-shadow: 0 0 0 3px #3a2060, 0 0 0 6px #1e0f40, 0 20px 60px rgba(0,0,0,0.7),
              inset 0 1px 0 rgba(255,255,255,0.08);
  display: flex; flex-direction: column; overflow: hidden;
}
#notch {
  width: 110px; height: 22px;
  background: #111; border-radius: 0 0 14px 14px;
  margin: 0 auto; z-index: 5; position: relative;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
#screen {
  flex: 1;
  background: linear-gradient(160deg, #13003a 0%, #1e0050 50%, #0a002a 100%);
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 12px 10px; position: relative; overflow: hidden;
}
#hud {
  display: flex; width: 100%; justify-content: space-between;
  align-items: center; padding: 4px 0 6px;
}
#score-box, #best-box {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px; padding: 4px 12px;
  font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
}
#score-box { color: #e8d6ff; }
#best-box  { color: #ffd6b0; font-size: 12px; }
#title-small {
  color: #b97fff; font-size: 15px; font-weight: 900;
  letter-spacing: 1px; text-shadow: 0 0 12px #8b3fff;
}
#next-bar {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 6px; font-size: 11px; color: rgba(255,255,255,0.5);
}
#next-preview {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; border: 2px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.05);
}
#grid-wrap { width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; }
#grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%;
}
.cell {
  aspect-ratio: 1; border-radius: 14px;
  background: rgba(255,255,255,0.04);
  border: 1.5px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; cursor: pointer; position: relative; overflow: hidden;
  transition: box-shadow 0.12s;
}
.cell.occupied { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.16); }
.cell.drop-col { background: rgba(200,130,255,0.10); }
.cell.pop-anim { animation: cellPop 0.25s ease-out; }
@keyframes cellPop { 0% { transform:scale(1); } 40% { transform:scale(1.28); } 100% { transform:scale(1); } }
.cell-glow {
  position: absolute; inset: 0; border-radius: 12px; pointer-events: none;
  opacity: 0.4;
}
.overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(10,0,28,0.88); z-index: 50; gap: 14px;
  backdrop-filter: blur(3px);
}
.overlay h1 { font-size: 30px; font-weight: 900; color: #c87fff;
  text-shadow: 0 0 20px #9040ff, 0 0 40px #6020cc; letter-spacing: 2px; }
.overlay p { color: rgba(255,255,255,0.7); font-size: 13px;
  text-align: center; line-height: 1.6; max-width: 230px; }
.btn {
  background: linear-gradient(135deg, #8b3fff, #5010b0);
  color: #fff; border: none; border-radius: 22px; padding: 11px 36px;
  font-size: 15px; font-weight: 700; cursor: pointer;
  box-shadow: 0 4px 20px rgba(139,63,255,0.5); letter-spacing: 0.5px;
  transition: transform 0.1s, box-shadow 0.1s;
}
.btn:active { transform: scale(0.96); }
.sub { color: rgba(255,255,255,0.4); font-size: 11px; text-align: center; }
.score-reveal { color: #ffd6b0; font-size: 18px; font-weight: 800; text-shadow: 0 0 10px #ff9040; }
.score-pop {
  position: absolute; pointer-events: none;
  font-weight: 900; font-size: 17px; color: #c0ff80;
  text-shadow: 0 0 8px #60ff20; z-index: 100;
  animation: scoreFly 0.9s ease-out forwards;
}
@keyframes scoreFly {
  0%   { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-50px) scale(0.7); }
}
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="phone">
  <div id="notch"></div>
  <div id="screen">
    <div id="hud">
      <div id="score-box">Score: <span id="score-val">0</span></div>
      <div id="title-small">🌸 BLOOM</div>
      <div id="best-box">Best: <span id="best-val">0</span></div>
    </div>
    <div id="next-bar">
      <span>Next:</span>
      <div id="next-preview"></div>
      <span style="margin-left:auto;font-size:10px;color:rgba(255,255,255,0.3)">tap column to drop</span>
    </div>
    <div id="grid-wrap"><div id="grid"></div></div>

    <div class="overlay" id="start-overlay">
      <h1>🌸 Merge Bloom</h1>
      <p>Drop flowers into columns.<br>Two matching flowers merge into the next bloom.<br>Chain merges for huge points!</p>
      <button class="btn" id="start-btn">Tap to Play</button>
      <div class="sub">Keys 1–5 drop · R restart</div>
    </div>

    <div class="overlay" id="gameover-overlay" style="display:none">
      <h1>🥀 Game Over</h1>
      <div class="score-reveal" id="final-score-label">Score: 0</div>
      <p>The garden is full.<br>Merge higher to survive!</p>
      <button class="btn" id="restart-btn">Play Again</button>
      <div class="sub">R to restart</div>
    </div>
  </div>
</div>

<script>
// ── Merge Bloom — merge puzzle ──────────────────────────────────────────────
// Tier list: emoji + glow colour + score points on merge
const TIERS = [
  { e:'🌱', glow:'#4caf50', pts:10  },
  { e:'🌼', glow:'#ffd740', pts:25  },
  { e:'🌷', glow:'#f06292', pts:60  },
  { e:'🌺', glow:'#ff5722', pts:130 },
  { e:'🌸', glow:'#ce93d8', pts:280 },
  { e:'🌻', glow:'#ffca28', pts:600 },
  { e:'🪷', glow:'#b39ddb', pts:1200},
  { e:'💐', glow:'#80cbc4', pts:2500},
];
const MAX_TIER = TIERS.length - 1;
const COLS = 5, ROWS = 8;

// ── State ──────────────────────────────────────────────────────────────────
let grid        = [];   // [row][col] = tier number or null
let score       = 0;
let best        = 0;
let nextTier    = 0;
let gameRunning = false;
let merging     = false; // block input during cascade

// ── DOM refs — script is at end of body so DOM is already built ────────────
const gridEl       = document.getElementById('grid');
const scoreValEl   = document.getElementById('score-val');
const bestValEl    = document.getElementById('best-val');
const nextPreview  = document.getElementById('next-preview');
const startOverlay = document.getElementById('start-overlay');
const gameOverOv   = document.getElementById('gameover-overlay');
const finalLabel   = document.getElementById('final-score-label');
const startBtn     = document.getElementById('start-btn');
const restartBtn   = document.getElementById('restart-btn');
const screenEl     = document.getElementById('screen');

// ── Helpers ────────────────────────────────────────────────────────────────
function newGrid() { return Array.from({length:ROWS}, () => Array(COLS).fill(null)); }

function pickNextTier() {
  const maxSpawn = Math.min(3, Math.floor(score / 500));
  const r = Math.random();
  if (r < 0.50) return 0;
  if (r < 0.75) return Math.min(1, maxSpawn);
  if (r < 0.90) return Math.min(2, maxSpawn);
  return Math.min(3, maxSpawn);
}

function cellEl(r, c) { return gridEl.children[r * COLS + c]; }

// ── Render — rebuilds inner HTML of each cell cleanly ─────────────────────
function render() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const el  = cellEl(r, c);
      const tier = grid[r][c];
      // Clear children safely
      while (el.firstChild) el.removeChild(el.firstChild);
      if (tier === null) {
        el.className = 'cell';
      } else {
        el.className = 'cell occupied';
        const span = document.createElement('span');
        span.textContent = TIERS[tier].e;
        span.style.cssText = 'position:relative;z-index:1;';
        const glow = document.createElement('div');
        glow.className = 'cell-glow';
        glow.style.background = 'radial-gradient(circle at 50% 50%, ' + TIERS[tier].glow + '99, transparent 70%)';
        el.appendChild(glow);
        el.appendChild(span);
      }
    }
  }
  nextPreview.textContent = TIERS[nextTier].e;
  nextPreview.style.background = 'radial-gradient(circle, ' + TIERS[nextTier].glow + '55, transparent)';
  scoreValEl.textContent = score;
  bestValEl.textContent  = best;
}

// ── Build DOM grid (5×8 cells) ────────────────────────────────────────────
function buildGrid() {
  gridEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      gridEl.appendChild(cell);
    }
  }
}

// ── Drop a tile into a column ──────────────────────────────────────────────
function dropIntoCol(col) {
  if (!gameRunning || merging) return;
  // Find lowest empty row in this column
  let landRow = -1;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (grid[r][col] === null) { landRow = r; break; }
  }
  if (landRow === -1) return; // column full

  grid[landRow][col] = nextTier;
  nextTier = pickNextTier();
  render();
  popAnim(landRow, col);
  merging = true;
  sweep(() => { merging = false; checkGameOver(); });
}

function popAnim(r, c) {
  const el = cellEl(r, c);
  el.classList.add('pop-anim');
  el.addEventListener('animationend', () => el.classList.remove('pop-anim'), {once:true});
}

// ── BFS cluster ─────────────────────────────────────────────────────────────
function bfsCluster(startR, startC, tier) {
  const visited = new Set();
  const queue   = [[startR, startC]];
  visited.add(startR * COLS + startC);
  while (queue.length) {
    const [r, c] = queue.shift();
    for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
      const nr = r+dr, nc = c+dc;
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
      const key = nr*COLS+nc;
      if (!visited.has(key) && grid[nr][nc] === tier) {
        visited.add(key); queue.push([nr, nc]);
      }
    }
  }
  return [...visited].map(k => [Math.floor(k/COLS), k%COLS]);
}

// ── Gravity: tiles fall down within each column ───────────────────────────
function applyGravity() {
  for (let c = 0; c < COLS; c++) {
    const col = [];
    for (let r = ROWS-1; r >= 0; r--) { if (grid[r][c] !== null) col.push(grid[r][c]); }
    for (let r = ROWS-1; r >= 0; r--) { grid[r][c] = col.length ? col.shift() : null; }
  }
}

// ── Cascade merge sweep ────────────────────────────────────────────────────
// Scans grid for any adjacent cluster of 2+ same-tier tiles; merges them;
// applies gravity; repeats until nothing merges.
function sweep(done) {
  let found = false;
  outer:
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const tier = grid[r][c];
      if (tier === null || tier >= MAX_TIER) continue;
      const cluster = bfsCluster(r, c, tier);
      if (cluster.length < 2) continue;
      // Merge: erase cluster, place upgraded tile at anchor
      for (const [cr, cc] of cluster) grid[cr][cc] = null;
      grid[r][c] = tier + 1;
      const pts = TIERS[tier+1].pts * cluster.length;
      score += pts;
      if (score > best) best = score;
      applyGravity();
      render();
      popAnim(r, c);
      floatScore(r, c, '+' + pts);
      found = true;
      break outer;
    }
  }
  if (found) { setTimeout(() => sweep(done), 190); }
  else        { done(); }
}

// ── Float score popup ──────────────────────────────────────────────────────
function floatScore(r, c, text) {
  const el   = cellEl(r, c);
  const rect = el.getBoundingClientRect();
  const sr   = screenEl.getBoundingClientRect();
  const pop  = document.createElement('div');
  pop.className  = 'score-pop';
  pop.textContent = text;
  pop.style.left = (rect.left - sr.left + rect.width/2 - 18) + 'px';
  pop.style.top  = (rect.top  - sr.top  + 4) + 'px';
  screenEl.appendChild(pop);
  pop.addEventListener('animationend', () => pop.remove(), {once:true});
}

// ── Game over ──────────────────────────────────────────────────────────────
function checkGameOver() {
  for (let c = 0; c < COLS; c++) {
    if (grid[0][c] !== null) {
      gameRunning = false;
      finalLabel.textContent = 'Score: ' + score;
      gameOverOv.style.display = 'flex';
      return;
    }
  }
}

// ── Start / restart ────────────────────────────────────────────────────────
function startGame() {
  grid        = newGrid();
  score       = 0;
  merging     = false;
  nextTier    = pickNextTier();
  gameRunning = true;
  startOverlay.style.display  = 'none';
  gameOverOv.style.display    = 'none';
  buildGrid();
  render();
}

// ── Grid input ────────────────────────────────────────────────────────────
gridEl.addEventListener('click', function(e) {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  dropIntoCol(parseInt(cell.dataset.col, 10));
});

gridEl.addEventListener('mousemove', function(e) {
  const cell = e.target.closest('.cell');
  document.querySelectorAll('.cell.drop-col').forEach(c => c.classList.remove('drop-col'));
  if (cell) {
    const col = parseInt(cell.dataset.col, 10);
    for (let r = 0; r < ROWS; r++) cellEl(r, col).classList.add('drop-col');
  }
});
gridEl.addEventListener('mouseleave', function() {
  document.querySelectorAll('.cell.drop-col').forEach(c => c.classList.remove('drop-col'));
});

// ── Keyboard ──────────────────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.key === 'r' || e.key === 'R') { startGame(); return; }
  const col = parseInt(e.key, 10) - 1;
  if (col >= 0 && col < COLS) dropIntoCol(col);
});

// ── Button listeners ──────────────────────────────────────────────────────
startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

// ── Background petals (purely decorative) ─────────────────────────────────
(function() {
  const colors = ['#c87fff','#ff80ab','#b39ddb','#80cbc4','#ffd740'];
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    const size = 6 + (i * 1.1 % 10);
    p.style.cssText = 'width:'+size+'px;height:'+size+'px;background:'+colors[i%5]+
      ';left:'+(i*7.1%100)+'vw;animation-duration:'+(9+i*0.8)+'s;animation-delay:-'+(i*1.3)+'s;';
    document.body.appendChild(p);
  }
})();
</script>
</body>
</html>
